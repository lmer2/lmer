[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lmer"
version = "0.1.0"
description = "Containerized harness for running Claude Code against external repositories"
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "20C, LLC", email = "info@20c.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "python-dotenv>=1.0.0",
    "pre-commit>=3.5.0",
    "requests>=2.25.0",
    "pyyaml>=6.0",
    # Note: For FIPS compliance, ensure cryptography>=41.0.0 if needed
    # All crypto operations must use FIPS-approved algorithms
    "jinja2>=3.1.6",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "flake8>=3.8.0",
    "black>=21.0.0",
    "mypy>=0.800",
]

[project.scripts]
lmer = "lmer_cli.cli:main"
lmer-supervisor = "lmer_cli.supervisor:main"
lmer-pipe = "lmer_cli.pipe:main"
gitlab-review = "gitlab_reviewer.cli:main"
work = "work_repo.cli:main"

[project.urls]
Homepage = "https://github.com/lmer2/lmer"
Repository = "https://github.com/lmer2/lmer"
Documentation = "https://github.com/lmer2/lmer/tree/main/docs"
Issues = "https://github.com/lmer2/lmer/issues"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "slow: marks tests that build/run containers (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*", "*/site-packages/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
