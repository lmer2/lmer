[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lmer"
version = "0.2.0"
description = "Containerized harness for running Claude Code against external repositories"
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "20C, LLC", email = "info@20c.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "python-dotenv>=1.2.2",
    "pre-commit>=3.5.0",
    "requests>=2.33.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.6",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "slack-bolt>=1.18.0",
    "aiohttp>=3.9.0",
    "certifi>=2023.7.22",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "flake8>=3.8.0",
    "black>=26.3.1",
    "mypy>=0.800",
]

[project.scripts]
lmer = "lmer_cli.cli:main"
lmer-supervisor = "lmer_cli.supervisor:main"
lmer-pipe = "lmer_cli.pipe:main"
gitlab-review = "gitlab_reviewer.cli:main"
lmer-slack = "slack_chat.cli:main"
lmer-slack-listener = "slack_chat.listener:main"
github-review = "github_reviewer.cli:main"
work = "work_repo.cli:main"

[project.urls]
Homepage = "https://github.com/lmer2/lmer"
Repository = "https://github.com/lmer2/lmer"
Documentation = "https://github.com/lmer2/lmer/tree/main/docs"
Issues = "https://github.com/lmer2/lmer/issues"

[tool.uv]
package = true
# Lock out package releases newer than one week to reduce supply-chain risk
# (a freshly published malicious/compromised version is not resolved until it
# has been public for at least a week). Relative-duration syntax requires uv
# from Dec 2025 or later.
exclude-newer = "1 week"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
asyncio_mode = "auto"
markers = [
    "slow: marks tests that build/run containers (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*", "*/site-packages/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
