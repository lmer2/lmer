changed:
- "The agent-facing ERROR GATE in AGENTS.md now gates on what a fix costs instead of on the fact that something failed (#137). Previously any error — including the agent's own bad regex or a wrong flag — required human approval before the agent could respond, which conflated showing the error (always) with authorizing the fix (rarely). The rewritten gate tells agents to fix-and-continue on their own malformed commands, and to keep working a capability gap when an equivalent substitute or another sound route exists (naming what they used), while still stopping for approval when only the human can supply what is missing (credentials, network access, an install), when every remaining route would degrade the deliverable, when the fix would mutate state or is hard to reverse, or when the cause is not understood — the churn the gate was written to prevent. Showing the full error stays unconditional, and the existing report format is kept for the stop-and-ask cases."
- "New companion rule for sessions with no human attached (#137): no gate may end the turn with a question — the agent states what it would have asked and why it stopped, and does not perform the gated action either. Approval granted before the session started (the launch prompt, the taskdef, `/gate-commit`) still counts, so a cron or CI run whose purpose is to produce committed work still commits; the rule covers approvals the agent would have to obtain right now, from someone who is not there. Because no lmer path renders an environment value into a model's context, the rule text is delivered rather than merely flagged: `LMER_NONINTERACTIVE` (truthy `1`/`true`/`yes`) makes `libexec/claude-runner.sh` append the new `prompts/non-interactive.md` fragment to claude's system prompt and `harness_render_global_context` write it into codex/pi's global context file, and `spawn-harness` — whose children exec a harness binary with no runner script to inject anything — prepends the same rule in-band at the head of every child prompt, on top of setting `LMER_NONINTERACTIVE=1` on the child unconditionally (no preset overlay or `--env` pair can unset it). This matters most in headless children, where an approval question is not a pause but a dropped result: the child exits 0 with a near-empty output file and a fan-out silently consolidates from N-1 agents. See `LMER_NONINTERACTIVE` in docs/LMER-CLI.md"
