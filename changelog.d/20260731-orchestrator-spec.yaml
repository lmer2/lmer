# changelog.d/20260731-orchestrator-spec.yaml — branch feature/orchestrator-spec
added:
- "Orchestrated sessions can ask their operator a question (#141): a session the lmer platform spawned gets a per-session **ask channel** — a 0700 host directory bind-mounted into the container (`LMER_ASK_DIR=/home/developer/.lmer-ask`) — and a new `lmer-ask` CLI to use it. `lmer-ask ask \"<question>\" [--option …]` posts the question and blocks until the operator answers (answer on stdout, exit 0), exits 2 if nobody has answered yet (the question stays open; `lmer-ask wait <id>` resumes), and exits 3 when there is no channel at all, so an un-orchestrated session fails cleanly instead of hanging. `lmer-ask note` posts a progress note that expects no reply; `lmer-ask list` prints the channel. The wire format is plain text plus an optional list of strings — no harness-specific question tool — so claude, codex and pi all get the same contract. A mount rather than an HTTP call: the platform binds on the host, which no container reaches without a runtime-specific gateway address, and this way the platform's shared secret never enters a session. On the operator's side the fleet view shows a waiting session as `is waiting on your reply` (attention reason `live_question`, sorted above a stopped question), and the run's detail page grows an **operator channel** section with the question, its suggested options, its notes and a reply box. Deliberately distinct from answering a run that STOPPED on a question (`POST /api/runs/answer`, which respawns the run): this reply is a file the running container is already polling, so no container is started. Ids are allocated with `os.link`, so two agents asking at once cannot collide, and an answer carries the question's id and a nonce so it can never be applied to a different question. The instruction to use it is a prompt fragment (`prompts/orchestrator-ask.md.jinja2`) injected only when `LMER_ASK_DIR` is set, so existing taskdefs need no changes and non-orchestrated sessions are told nothing"
