# changelog.d/20260803-issue-210-submit-cr-swallowed.yaml — branch fix/issue-210-submit-cr-swallowed
fixed:
- "Messages sent into a session submit again, at any length (#210). A message and its submit Enter went to the session's terminal in one write, which a harness TUI reads as a *paste* — where `\\r` is a newline character, not the Enter key — so past roughly 80 bytes the message landed in the input box unsent and the operator had to press Enter from the terminal view. The Enter is now a write of its own, sent once the harness has taken the text. This affected every caller of the supervisor's `/input`: the control UI's chat pane, `POST /api/sessions/{id}/input`, `lmer pipe send`, `lmer platform ctl input` and the Slack path. The supervisor runs inside the session container, so a session picks the fix up once it is restarted on a rebuilt image"
- "Known still-broken, tracked separately so they are not mistaken for the same bug: a message with many embedded newlines does not submit (#230), and on a heavily loaded host a send can still land unsent (#231). Neither is a regression"
added:
- "`LMER_SUBMIT_ENTER_DELAY` — extra margin between a submitted message's text and its Enter, for a harness still coalescing input after it has read the text. Default `0.2` seconds, capped at 1; applies to sessions started after it is set"
- "`POST /input`, and the platform route forwarding it, now also report `submit_text` — `read`, `unread` or `unknown`: whether the harness was seen taking the text before Enter was pressed. `submit_confirmed` is unchanged, since the supervisor still cannot see the screen"
