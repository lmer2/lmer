added:
- "Platform: the orchestrating assistant (uber lmer) is configurable per platform
  instance — which model it runs on, plus harness, preset and agents fan-out —
  through `LMER_PLATFORM_ASSISTANT_MODEL`/`_HARNESS`/`_PRESET`/`_AGENTS`, the
  matching `assistant_*` keys in `config.json`, or explicit values in the
  `POST /api/assistant/start`/`rotate` body (explicit > env > config.json >
  default, the platform's usual chain). Settings are resolved fresh at every
  assistant start and rotate, so a persisted change takes effect on the next
  incarnation without a daemon restart; unusable values — including harness,
  preset and agents names the host's own authorities would refuse — warn and
  read as unset rather than making the assistant unstartable, and explicit
  writes of such values are refused with the field and catalog named (#234)"
- "Platform API: `GET /api/assistant/config` reports each assistant launch
  setting with the layer that decided it (env / config.json / default) and the
  stored value an export may be shadowing; `POST /api/assistant/config`
  persists a patch of the named keys into `config.json` only — env-resolved
  values are never baked into the file, and `null` clears a key.
  `GET /api/assistant` now carries `settings`: what the running incarnation was
  actually launched with (#234)"
- "Control UI: a settings dialog in the uber lmer drawer (overflow menu) —
  per-key provenance, a warning when an export shadows the persisted value, a
  plain statement that changes apply to the next incarnation, and a restart
  offer to apply them now (#234)"
