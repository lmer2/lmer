added:
- "A session halted by a Claude API error now shows as needing attention instead of reading as healthy (#243). A spend limit or a `529 Overloaded` the retries gave up on used to leave the run at `running`/`in-progress` with no attention record and no digest — three such runs sat unnoticed for two and a half hours on 2026-08-04. The run now carries a `stalled` attention reason (`stopped responding` in the UI) and the orchestrating assistant gets a digest naming it. Nothing is sent to the session; flagging is the whole behaviour. Silence alone never raises it: a session waiting on a background command is exactly as quiet as a halted one, so the newest transcript turn has to agree — the harness marked it as a provider refusal, or it is input nothing answered. A second, longer threshold flags any silent run regardless, so a halt neither check recognises is found late rather than never, and the note says which of the three fired. The orchestrating assistant and `chat` sessions are exempt. `LMER_PLATFORM_STALL_IDLE_SECONDS` (600) and `LMER_PLATFORM_STALL_BACKSTOP_SECONDS` (3600) tune the thresholds, both are `config.json` fields, and `0` disables either. The chat message payload gains `api_refusal`, `api_error` and `api_error_status`. **On upgrade:** rebuild or re-pull the UI bundle with the daemon restart, or the fleet view shows the raw word `stalled`; the restart is what makes the config fields take effect. No migration. See 'stopped responding' in docs/PLATFORM-QUICKSTART.md"
