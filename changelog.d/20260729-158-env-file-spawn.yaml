security:
- "Session container environment no longer travels in the `docker`/`podman run` command line (#158). Every variable a session carries was passed as a `-e NAME=value` argument — the form used since the project's initial commit — which put the values in the spawning client's argv, where `/proc/<pid>/cmdline` is world-readable and `ps -ef` shows them plainly for the whole life of the session. That exposed the credentialed work-repo clone URL (`LMER_WORK_REPO`, which embeds an `oauth2:<token>@` userinfo), `GITLAB_TOKEN` and its per-host variants, `LMER_WORK_REPO_TOKEN`, `LMER_FASTAPI_TOKEN`, the release PAT and Slack tokens to any other user on the host. Values now reach the container two ways, neither of which is argv: everything the line-oriented env-file format carries faithfully is written to a mode-0600 file inside a mode-0700 temporary directory and passed as `--env-file` (accepted by both runtimes), and everything else rides a bare `-e NAME` inheritance marker with the value handed to the runtime client's own environment, where `/proc/<pid>/environ` is mode 0400 and owner-only. Multi-line values therefore keep working exactly as they did — a multi-line `--prompt`/`--answer` and Slack thread text all carry newlines, which an env-file-only transport would have silently truncated. There is no inline fallback: a variable neither transport can carry aborts the launch with a message naming the variable and the reason, value redacted, so the no-value-in-argv property is enforced rather than documented (and asserted as a postcondition in the builder itself). Reaching that state takes a name no bare marker can express (empty, containing `=`, or ending in `*`, which podman glob-expands), or a name the runtime client reads from its own environment (`PATH`, `HOME`, `TMPDIR`, the `DOCKER_*` and podman client variables, the proxy and `SSL_CERT_*` names) whose value also contains a newline. That reserved list is deliberately explicit and narrow rather than prefix-matched: it gates a hard refusal, so over-reserving would refuse launches for names no client reads, and completeness there is a functional convenience rather than a security boundary (a name missing from it can only corrupt the client's own environment, never leak a value). Several shapes that worked before are routed to the marker leg rather than refused, each verified against a real docker client: a name an env file would misread (`#`-prefixed, or containing a space or tab, which docker's env-file parser rejects outright while podman's accepts — a runtime-dependent outcome); a name an env file would silently rename (one with leading whitespace, which docker strips with Go's `unicode.IsSpace` — NBSP, VT, FF and U+3000 included — before splitting on `=`, so a stray NBSP-prefixed copy of a real variable would collapse onto it and, `Config.Env` being last-wins, silently displace it); a name a bare marker handles fine despite looking odd (leading `-`, interior `*`); and an encoded `NAME=value` line at or over 64 KiB, the token limit both env-file parsers inherit from Go's `bufio.Scanner`, past which docker aborts the spawn — the marker leg's ceiling (`MAX_ARG_STRLEN`, 128 KiB) is twice as generous, and the measurement is on the encoded line rather than the value so a multibyte value is counted as the parser counts it. A `SIGTERM` handler deletes the env file so a reaped session (systemd `KillMode=control-group`, an orchestrator, a session reaper) no longer strands one, leaving only a `SIGKILL` of `lmer` itself able to — owner-only, under `$TMPDIR`. The handler deliberately does not raise: unwinding would pass through `subprocess.call`'s bare `except: p.kill()` and SIGKILL the container runtime client, and in a non-TTY spawn that client forwarding the signal is what stops the container (`--sig-proxy` is non-TTY-only, and `--rm` removal is daemon-side and conditional on that exit), so raising would have traded a stranded file for a stranded running container. It cleans up, restores the default disposition and re-raises the signal at itself, leaving process semantics identical to having no handler for any process whose SIGTERM disposition is the default, which is every way lmer is invoked. A name or value no transport can deliver — one containing a NUL byte, or one that is not valid UTF-8, where docker's env-file parser rejects the whole file and the client environment would silently substitute U+FFFD — is refused up front with the variable named, rather than aborting the spawn from inside docker or corrupting the value quietly; and the builder removes its own temporary directory (and closes its own descriptor) if anything fails mid-write, so a full or failing disk cannot strand a file with token lines already in it. As a side effect the verbose `Running: …` line, which prints the assembled run command, no longer echoes any environment value; the one inline `-e` that can still appear is the SSH-agent mount's `SSH_AUTH_SOCK=/ssh-agent`, a fixed container-side socket path. Cross-runtime behaviour is covered by an integration test that round-trips values with spaces, both quote kinds, `=`, `$`, `#`, significant whitespace and non-ASCII through every runtime installed on the host and skips cleanly when none is present, since nothing promises docker's and podman's env-file parsers agree. See 'How the environment reaches the container' in docs/CONTAINER.md"
