# changelog.d/20260731-orchestrator-platform.yaml — branch feature/orchestrator-platform
fixed:
- "SELinux detection no longer depends on `getenforce` being installed (#150): `lmer_cli.runtime._is_selinux_enforcing()` reads `/sys/fs/selinux/enforce` and only falls back to the shell-out. Sessions are spawned from *inside* the platform container, which carries no `selinux-utils`, so on an SELinux-enforcing host every spawned session was losing `--security-opt label=disable` and the `,z` relabel suffix on its bind mounts and dying on AVC denials against `/workspace` and its mounted credentials — while the platform container itself ran fine. selinuxfs is visible in the container on such a host, so reading it removes the package dependency for every caller"
- "`POST /input` presses Enter once and says so (#141): the supervisor no longer follows a submitted message with bare-CR \"nudges\". A bare CR is a no-op only against an empty input box with no dialog on screen — since Claude Code v2.1.119 it fires the topmost modal — and this path runs mid-session, when a tool-permission prompt is exactly what is on screen. The reply now carries `submit_confirmed: false` and a note saying the submit cannot be observed from outside the TUI, passed through by `POST /api/sessions/{id}/input`, rather than a second Enter that could take a permission prompt's default 150ms behind the operator's own message. Relatedly, text ending in a newline now gets a real Enter behind it: LF in raw mode is a literal newline, so `\"text\\n\"` with `append_newline` set used to be typed and never sent"
- "A non-ASCII credential answers 401 instead of 500 (#141): `secrets.compare_digest` refuses two `str` arguments unless both are ASCII-only, and the platform API compared the decoded `Authorization` header as a string — so one accented character typed into a browser's credential prompt raised `TypeError` off the dependency path. The result was a 500 with no `WWW-Authenticate` (so the browser never re-prompted) and no `platform_auth_rejected` log line (so the attempt was invisible in the daemon's record of refused auth). Both sides are now compared as UTF-8 bytes, which is an encoding rather than a validation rule: a non-ASCII shared secret stays usable"
