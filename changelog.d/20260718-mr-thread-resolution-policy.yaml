added:
- "Thread Resolution Policy (rules/git.md): review-thread resolution is the reviewer's verified sign-off — fix authors reply with the fix + commit SHA and leave threads open; only a human or a review session resolves. gitlab-review and github-review --resolve-thread now refuse (exit 1, no API call) in non-review sessions (LMER_TASK set and not 'review'), naming the workaround; provisioned taskdef text teaches the split (#128)"
- "gitlab-review/github-review --info render a thread-provenance block (thread counts, per-account resolver breakdown, page-cap truncation marker; JSON key thread_provenance) — gitlab-review also flags threads resolved before the MR's head commit; github-review derives blocking_discussions_resolved from real thread data instead of hardcoding True (#128)"
