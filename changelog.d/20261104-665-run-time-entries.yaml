added:
- "An automatic time entry belongs to the run its activity came from: it takes the run's title (and follows it until a person sets one) and lists the run's issues and merge requests in an optional `issues:` key."
- "Handler fields can be marked `per_issue: true`, and a handler can keep an issue map at `timesheet.d/.handlers/<name>/issues.yaml`: an entry's field values follow its first issue (the person's last value for it, then the map), and a missing one prompts per issue."
- "A prompt is answered from the time bar or with `lmer-ctl time start --prompt ID --field KEY=VALUE`; the value is remembered for that issue."
- "`lmer-ctl runs meta set <key> --issue URL` (and `issues` on `POST /api/runs/meta`) lists the issues a run is about beyond its target."
changed:
- "A run switch inside a project splits the time entry (`switch`); the person's messages to Ratchet extend the running entry. A manual timer follows runs in its project the same way and stays manual."
- "Changing the title, client or a handler field after time has accrued splits the entry (`trigger.stop: edit` / `trigger.start: edit`); filling an empty value still edits in place. The time bar sends what its form loaded, so a title the run renamed meanwhile is not taken for an edit."
- "An automatic entry with no run no longer takes the session's run name as its title."
fixed:
- "The time-tracking docs no longer say a manual start by Ratchet adds a run: Ratchet has no run."
