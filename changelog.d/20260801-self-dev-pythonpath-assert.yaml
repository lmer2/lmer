- "Self-development sessions now import lmer from the `/workspace` checkout rather than the operational runtime (#198). The container entrypoint exports `PYTHONPATH=/Agents/global/src:…`, and `PYTHONPATH` precedes site-packages, so it beat the editable `.pth` that the self-dev block rewrites to `/workspace/src` — a bare `pytest`, `uv run pytest` or `python -c` in a self-dev session imported the operational tree while the developer edited the checkout. Both self-dev blocks (`libexec/claude-runner.sh` and `harness_detect_self_dev` in `libexec/harness-common.sh`) now prepend `/workspace/src` to the exported `PYTHONPATH`, keeping `/Agents/global/src` behind it as the deliberate fallback for packages that exist only on the operational ref. Two things make it checkable rather than a claim: the self-dev startup banner prints the `lmer_cli` path the session actually resolved (unconditionally, and warns when it is outside `/workspace`), and `tests/test_import_provenance.py` fails the suite whenever the lmer it imported — or any package under `src/` as Python would resolve it — lives outside the checkout, naming both the resolved path and the repo root. Scope note: `gate-check` was NOT affected, because `check_tests` already prepends `<project>/src` to the pytest subprocess's `PYTHONPATH`; a branch validated with `gate-check` was validated against its own code. The six `hooks/*.sh` scripts that prepend the operational tree are deliberately unchanged — they run their sibling `.py` from the operational directory and run no tests"
