added:
  - "Projects can opt into reuse of a recent successful `pre-commit run --all-files` pass through work-repo project info. The short-lived key follows checked worktree bytes across landing-train commits and covers config and hook pins, executable and version, argv, environment, and the Git attributes, merge state, and staged-added paths used by agents/global's pinned hooks. (#318)"
fixed:
  - "Assistant status can no longer observe a newly registered incarnation under the previous lifecycle generation, without making UI status polls wait for container spawn or termination grace periods. (#318)"
  - "The platform learns the harness a session actually resolved, so Codex and Pi footer geometry applies when a preset or model hint selected it; the minimum five-row terminal still reports a valid size. Existing source deployments must re-run `lmer platform setup-ui` to rebuild the web bundle. (#318)"
  - "Multi-kilobyte Claude, Codex, and Pi prose uses explicit bracketed-paste boundaries, while known Claude and Pi column-one commands remain keystrokes. (#318)"
  - "Native transcript adapters consistently outrank canonical derived twins, with one diagnostic per mixed session and record vocabulary kept separate from the cosmetic harness label. (#318)"
changed:
  - "Review-post wrapper names are no longer inferred as milestones by the signal guard; wrappers signal only after a successful post. (#318)"
