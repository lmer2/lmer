# changelog.d/20260729-release-ctl-pin.yaml — branch fix/release-ctl-pin
fixed:
- "Release taskdef leg 1: the ctl bootstrap installed from a stale copy of the ctl repository that does not contain the pinned commit, so every release run would have hard-stopped at 'ctl install failed at pinned ref' before doing any release work (`upload-pack: not our ref`). The canonical ctl lives under the `gh/` namespace; the install path now points there, a regression test pins the namespace, and the pin provenance comment records that both the path and the commit were verified against the canonical repository with credentials rather than inferred from the GitHub mirror — which is how the wrong path went unnoticed, since the SHA was validated but the path never was"
changed:
- "Release taskdef leg 1: lmer's first release under this flow now runs in `fragments` changelog mode rather than `legacy`, and the pinned ctl moves to the `feature/changelog-d` merge on the canonical repository's main. lmer already accumulates its unreleased changelog entries as per-branch `changelog.d/` fragments, so a legacy `CHANGELOG.yaml` roll would have consumed only the residual `unreleased:` section and silently left every fragment behind — publishing a release whose changelog omitted the changes it shipped. This supersedes bootstrap step 1 in docs/RELEASE-ADOPTION.md §6, which assumed the first release would predate a fragment-capable ctl; switching the ctl dependency from a git pin to the released PyPI package remains a later step that still waits on ctl releasing through this flow"
