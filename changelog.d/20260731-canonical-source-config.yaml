added:
- "Canonical source declarations (#105): the work repo can now declare the canonical taskdef/napkin source repos in a root `sources.yaml` (schema 1: `sources.taskdef.repo`/`ref`, `sources.napkin.repo` — deliberately profile-shaped for future named profiles). Resolution runs container-side in `clone_and_exec` after the work-repo clone: a declaration alone now configures the source (env vars become mismatch-checked overrides), a normalized-equal env value wins silently (it carries the credential; the new pure URL normalizer folds credentialed/`.git`/scp-form/`ssh://` spellings together before comparing, and an env value equal to the URL lmer would derive from the declaration counts as equal too, so a work repo on a custom SSH port takes this silent row instead of a mismatch), a mismatch prompts interactively or refuses start (exit 2) headless before any aux clone, and no declaration + no env is byte-identical silent legacy — an absent `sources.yaml` changes nothing. Declared URLs must live on the same host as the work repo (the work repo is agent-writable and declared sources inherit the work-repo credential, so cross-host declarations are refused, pointing at the operator-controlled env override; the comparison is on the hostname alone — scheme and port do not participate, so an SSH work repo on a custom port still accepts HTTPS declarations on the same host, while a declaration naming a *different* port than the work repo is cloned anonymously with the credential withheld, since a git host commonly runs unrelated services on other ports); embedded credentials in the file are a refuse-start error — including secrets containing a `/`, which are detected and scrubbed rather than printed, at the cost of over-redacting a URL that has both a non-default port and an `@` in its path; a scheme-less URL whose `@` follows a `/` (`a:b/c@d`) reads either as a slashed secret or as an scp-form path containing `@`, so it is refused as unreadable with both readings named rather than guessed at — and a declared source's clone failure is loud (prompt continue-in-legacy — which reverts that source's env propagation — or abort; exit 2 headless), never the aux-clone warn-and-continue. Ships with: a standalone `lmer_cli.container.sources` helper (importable without lmer_cli by the stdlib-only entrypoint; frozen doctor CLI `validate|normalize|derive|doctor --json [--emit-clone-urls]`), `lmer --show-env` sources block showing each source's value and origin (plus any forward-compat warnings the declaration raises, the same ones bin/doctor and startup print) (declared/env-match/env-override/env-only/unset-fallback — env-match is the normalized-equal row, matching the container banner's vocabulary; declared side read best-effort from the clone cache, which tells a work repo that declares nothing — `none (no sources.yaml in the work repo)` — apart from a cold cache — `unknown (work repo not cached)`), a loud per-name `/start` TASKDEF SHADOW warning when a higher-precedence tier (work-repo project/global or an earlier LMER_TASKDEF_PATHS entry) shadows a configured taskdef repo's taskdefs, a `🔗 Declared Sources` bin/doctor section (reachability, ref existence, taskdef schema support — warn-only; the helper CLI it drives defaults `doctor --path` to `${LMER_WORK_REPO_PATH:-/work}/sources.yaml`, and hands the credentialed clone URL to git through ephemeral `GIT_CONFIG_*` env so it never reaches argv or a temp file), and a Containerfile build gate asserting the entrypoint interpreter carries PyYAML. Known trade-off: a source declared only in `sources.yaml` is not clone-cache accelerated — the host warms mirrors from the env-var forms, so a declaration-only source is cloned directly every session (keep the env var set alongside the declaration, the silent `env-match` row, if warm mirrors matter for it). See 'Canonical Source Declarations' in docs/LMER-CLI.md and the updated resolution order in docs/TASKDEFS.md"
