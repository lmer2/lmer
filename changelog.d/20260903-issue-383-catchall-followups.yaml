fixed:
- The crash digest no longer reports a run's state as never committed when the work-repo mirror
  was simply a pull behind; the claim is checked against a refreshed mirror first.
- A session the operator asked to wind down is no longer labelled crashed when it exits, unless a
  watcher recorded that it exited badly. Its stale entry is cleaned up rather than accumulating.
- Removing a session's registry entry can no longer be undone by an update already in flight, which
  left the fleet view showing a deliberately stopped session as crashed.
added:
- The assistant memory store now reports whether the container actually linked it, and whether that
  record is the running session's, so an empty store is diagnosable instead of ambiguous.
