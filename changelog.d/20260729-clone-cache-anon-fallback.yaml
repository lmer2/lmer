fixed:
- "The clone-cache updater no longer loses a mirror to a credential the remote rejects (#157). A credential lmer injects is not necessarily one the target host accepts — on a machine with `GITLAB_TOKEN` set and no GitHub token, the generic token fallback puts that GitLab PAT into every `github.com` URL, and GitHub challenges it even for a **public** repo — so mirroring a public repo died at `fatal: could not read Username for 'https://github.com': terminal prompts disabled` while an anonymous fetch of the same URL would have succeeded (and the session's own clone of such a repo could still work, which made the cache look topologically broken rather than mis-credentialed). An attempt that carried credentials and failed is now retried **once with lmer's own injected credential dropped and nothing else changed** — the same empty environment a URL lmer could not credential already gets, so your git config keeps authenticating the retry exactly as it would a tokenless fetch — and the public repo mirrors regardless of which token got injected upstream; the retry is logged rather than being silent, and if it fails too, its own cause is logged alongside the credentialed failure that gets reported (a retry that died of `No space left on device` used to surface as the auth error). The decision to retry reads only what the updater knows it sent — whether it attached an `http.<url>.extraHeader` Authorization header — and never git's error text, which is byte-identical for a rejected credential, a private repo and a nonexistent path and so cannot carry the decision. **Only a non-zero git exit earns the retry**: a `subprocess.TimeoutExpired` or a local `OSError` propagates untouched, because retrying a create that hit its 15-minute timeout would start a second *from-scratch* transfer (the build directory is removed on failure, so nothing resumes) and double a window in which that mirror's flock is held — and a held lock is skipped rather than queued, so every launch in the doubled window silently gets no warming for the repo. A URL with no credentials still makes exactly one attempt, and a working token still succeeds on the first"
- "A credentialed clone-cache fetch now sends exactly **one** `Authorization` header — its own. An `http.extraHeader` in your git config (the corporate-proxy/Artifactory pattern) or one arriving in an inherited `GIT_CONFIG_KEY_n` pair was previously sent *alongside* the updater's header, leaving the remote to pick between two credentials, so a mirror could keep failing on a credential the updater never chose. The credentialed path now cancels inherited headers before adding its own — an empty `http.<url>.extraHeader` resets git's header list, verified against git 2.52.0 by recording what git puts on the wire for the bare `[http]`, matching-URL-prefix and inherited-env-pair forms. **Trade-off:** that reset clears git's whole header list for the URL rather than only its `Authorization` entries, so if you use `http.extraHeader` to carry a *required non-auth* header (proxy routing, a tenant id) it is dropped on a URL lmer credentials; git offers no narrower instrument, and the list cannot be read back and re-emitted selectively either, since `git config --get-urlmatch` reports only the single best-matching value rather than the accumulated list git actually sends — tracked as issue #179. URLs lmer cannot credential are untouched, and so is the anonymous retry above: both leave your own git config — headers and credential helper included — as the authenticating path"
