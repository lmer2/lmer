added:
- 'Persistent git clone cache (#112): warm sessions no longer re-clone the full project/work/napkin/taskdef repos over the network. The host CLI forks a detached background updater (`python -m lmer_cli.clone_cache`, repo URLs on stdin) that keeps one bare mirror per repo (`<host>/<project>.git`) under a persistent host directory (default `~/.lmer/clone-cache`, override with `LMER_CLONE_CACHE_DIR`), and bind-mounts that directory read-only into the container at `/clone-cache` (forwarded as `LMER_CLONE_CACHE_PATH`). The container is a pure consumer: when a mirror exists it clones with `--reference <mirror> --dissociate` — origin stays the real remote so branch/MR/push flows are untouched, a stale mirror only costs bytes (the clone still fetches what the mirror lacks from origin), and the dissociated clone never depends on the cache afterwards (the cache dir can be deleted freely). A session never waits on cache maintenance: a cold cache means a plain direct clone while the mirror builds in the background. No token can reach the cache, any argv, or the updater log: mirrors store only scrubbed origin URLs, credentials travel via stdin and ephemeral per-process git-config env, and the scrubbed size-capped log lives at `~/.lmer/logs/clone-cache.log` outside the mount. Mirrors are created with `gc.auto=0` (fetch can never repack under a reading container); updaters serialize per-mirror on a non-blocking flock, clean up stale git lock droppings, and clear-and-rebuild a damaged (HEAD-less) mirror dir instead of wedging on it. On by default; `LMER_CLONE_CACHE=0` disables mount and updater together, and every cache failure falls back with a warning to the previous direct-clone behavior. Bare-mirror fetches never pull git-LFS content (plain git objects still benefit). See docs/LMER-CLI.md'
