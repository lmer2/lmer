# changelog.d/20260731-web-chat-input-delivery.yaml — branch fix/web-chat-input-delivery
fixed:
- "The control UI's composers can be sent from a phone (issue 194): the send control moves out of the text field onto its own row — labelled, at least 44px tall, and full width below the `sm` breakpoint — in all three of them (the run/uber-lmer conversation, the ask-channel reply, and the answer that respawns a run). It was a 28px icon-only button inside a field whose whole surface focuses the textarea and raises the keyboard, and the only other way to send was Ctrl+Enter, which a phone keyboard has no key for. Reported live as messages typed into the assistant chat never reaching the session — 'newlines from the app aren't sending' — with the operator falling back to a host console. Enter is still a newline (on a phone the return key is the only way to type one), the chord still works, and each hint now leads with the tap instead of the chord"
- "The chat no longer reports a message as sent when the submit could not be confirmed (issue 194): `POST /input` answers `submit_confirmed: false` whenever it typed an Enter it cannot observe landing — which is every message typed at a TUI — and the conversation view discarded that reply, so a pending bubble whose message was still sitting unsent in the session's input box read 'sent — the transcript has not caught up yet'. Past its grace window it now says the submit is not confirmed and names both outcomes — the session may not have received the message at all (a dialog on screen consumes the keystrokes and answers itself with the Enter) or it may be sitting unsent in the input box — pointing at the terminal view, which is where the two can be told apart. What is *held* is unchanged: only the session's own transcript settles a bubble, never a clock"
- "A message written to a session's PTY can no longer be silently truncated: the supervisor's control-plane write loops until the payload is gone, like the session log's writer already did. `os.write` may write less than it was given, and an `/input` payload's last byte is its submit CR — so a short write would have left a partial message typed and unsent under a 200 with a byte count over it"
