changed:
- "Slack listener: a `$preset:<name>` token now DISPLACES the listener-wide preset
  default instead of stacking with it. Every session the listener spawns is an
  `lmer chat` invocation inheriting the listener's environment, so a
  `LMER_CHAT_PRESET` there selects a preset for all of them; when a token also
  selected one, the two merged under two different rules — the token's `env` won
  conflicts while the default silently filled every gap. A token now removes every
  preset selector from the spawned session's environment, so the default is never
  loaded: none of its values survive and none of its keys are inherited where the
  token's preset leaves them unset (#181)"
- "Slack listener: the connecting ack now names the preset actually in effect — the
  token-selected one, the listener-wide default when no token was given, and the
  default a token replaced. `lmer_session_spawned` records the same pair as
  `preset=` plus `default_preset=` / `displaced_default=`, so no spawn can hide a
  second preset (#181)"
added:
- "Slack listener: an undefined listener-wide default (a `LMER_CHAT_PRESET` naming a
  preset that does not exist) is now reported in the thread, naming the variable and
  listing the available presets. Previously the spawned CLI exited 2 and the session
  died seconds after a cheerful \"Connecting…\", with the reason only in the
  listener's log (#181)"
- "docs/PRESETS.md documents the listener-wide default in full: that it exists, that
  a token replaces it whole, that its precedence over `LMER_PRESET` is the
  taskdef-scoped specificity rule rather than a bug, and what the ack says in each
  case (#181)"
