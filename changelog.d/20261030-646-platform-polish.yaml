added:
- "A header button (under Platform settings on a phone) asks every running Ratchet, with an optional reason, to hand over and rotate itself, and shows each one's progress."
- "`lmer --effort LEVEL` sets reasoning effort above presets and exports; projects, Ratchet settings and `lmer-ctl spawn` take an effort setting too."
- "Send Privately takes an optional, non-secret purpose that labels the agent's prompt, the file name and the chat entry."
- "Your chat bubbles take the project's color, kept readable in both color schemes; a Ratchet setting turns it off."
changed:
- "A private send shows in chat history as one compact entry instead of the agent-facing prompt text."
- "Project settings use two columns on wide screens, with a compact, centered color picker that keeps custom colors behind Custom…."
- "The composer's Send Privately button is now a lock labelled Private, icon-only in narrow chats; chat copy buttons are smaller."
fixed:
- "A failed chat poll in the Ratchet panel shows a one-line error instead of a card filling the panel."
- "A relayed message whose text holds something credential-shaped no longer shows twice in a session's chat."
