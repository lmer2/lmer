# changelog.d/20260801-ci-publish-built-image.yaml — branch fix/ci-publish-built-image
fixed:
- "A `v*` tag pipeline now publishes the container images its build stage actually built, instead of a second copy nobody had exercised (#189). Both images were built twice on a tag: `build-container`/`build-platform-container` built them — which for `Dockerfile.platform` *is* the only check there is, since no test can tell whether `npm ci`, the UI build and `pip install .` still succeed inside it — and then `publish-container`/`publish-platform-container` built them again from scratch and pushed those. The comment justifying the rebuild claimed the layers were still in the runner's cache; they were not, because each job declares its own `docker:dind` service and every dind starts with an empty `/var/lib/docker`, so the second build resolved everything again. With `docker-ce-cli` deliberately unpinned and npm optional dependencies resolving per build, `:${CI_COMMIT_TAG}` and `:latest` were therefore a different artifact from the one the build stage had exercised minutes earlier, and the pipeline paid two full builds to get there. Each image is now built exactly once: the build job pushes it under `:${CI_COMMIT_SHORT_SHA}` and records the digest the registry stored it as into a dotenv report, and the publish job pulls *that digest*, re-tags it to the release tags and pushes. The promotion is verified rather than trusted — re-tagging cannot change an image's content, but pushing writes a fresh manifest and nothing published promises the daemon regenerates one byte for byte, so the job re-reads each release tag from the registry and fails if what it serves is not the built digest, printing both. The new `scripts/ci-image.sh` carries it (`digest`/`promote`), reading digests from the daemon's own `RepoDigests` bookkeeping filtered by repository — not the positional `{{index .RepoDigests 0}}`, which picks by luck when an image is tagged into two repositories — and refusing anything that is not a `sha256:` digest before it makes a single docker call, because an unset dotenv variable would otherwise degrade `docker pull \"$repo@\"` to the bare repository, i.e. `:latest`, and re-publish whatever was already there. This had never fired in anger: every dind job on the runner died at `docker login` until the dind address was fixed, so `publish-platform-container` had not yet run once. See the tag-pipeline note in docs/RELEASE-FLOW.md"
