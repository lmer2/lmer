security:
- "A session now sees only the clone-cache mirrors of the repos it actually clones (#135). lmer previously bind-mounted the whole cache root at `/clone-cache`, so an agent in any session could read the bare mirrors — full history — of *every* repo you had ever cached, including private repos unrelated to that session and ones whose credentials that session was deliberately not given; `:ro` protected the cache's integrity, not its confidentiality, and agents routinely process untrusted input. The launch's own clone list (project, work, napkin/taskdef, and any secondary MR/PR target, deduplicated) is now mounted as one read-only bind per mirror, each at the same path under `/clone-cache` the root mount used to give it, so the container-side lookup and the `--reference <mirror> --dissociate` clone are unchanged. Only mirrors that already exist are mounted — a repo the cache has not built yet contributes no bind at all, which both keeps the cold-cache path (direct clone now, warm mirror next time) and stops Docker/Podman from creating a missing bind source as a root-owned directory on your host — and a mirror with no `HEAD`, or one whose path is a symlink escaping the cache root, is skipped rather than followed host-side. `LMER_CLONE_CACHE=0` still disables mount and updater together; `LMER_CLONE_CACHE_DIR`'s refusal of `/` and your home directory stays, now as a guard on where the host-side updater scatters mirror trees rather than on what the container can read"
