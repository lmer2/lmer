changed:
- "gate-push allow list: the repo half of an entry is now matched by a documented
  grammar instead of an unanchored substring test — exact repo (any URL spelling),
  whole host, `*.domain` wildcard, host + project prefix at segment boundaries, or
  a legacy host-less project path. Strictly tighter for every pre-existing entry
  shape: `group/project` no longer authorizes
  `https://evil.example.com/mirror/group/project`, and `group/proj` no longer
  authorizes `group/project` (#107)"
- "gate-push now requires EVERY push URL of the target remote to be allowed, not
  just the first — a remote with several pushurls sends the ref to all of them.
  Pre-existing gap, fixed here because the multi-URL resolution this grammar needs
  exposed it (#107)"
- "gate-push refuses a push target that does not parse into host/path (a filesystem
  remote, say) rather than falling back to a substring match, and says so.
  Pre-existing gap, likewise (#107)"
- "the release taskdef's documentation-only push-role block is renamed
  `needs.push_targets`: sharing the name of the live top-level `push_allow` grant
  key put a permission one stray dedent away from a whitespace-looking diff (#107)"
added:
- "taskdefs may declare their own push targets in a top-level `push_allow` list in
  `task.yaml`, unioned with `LMER_PUSH_ALLOW_LIST`. Resolved from the trusted
  taskdef tiers only — never the agent-writable work-repo tiers — so a manifest
  landed in the work repo cannot grant push targets to later sessions (#107)"
- "gate-push now reports the granting entry and its source on SUCCESS, not only on
  refusal; refusals name the checked target, every source consulted, and an example
  entry that would allow the push (#107)"
security:
- "push allow-list entries and remote URLs now agree on IPv6 hosts: a bracketed
  address (`[2001:db8::1]`, in any URL spelling git accepts) normalizes to that
  address at every enforcement point, and an unclosed bracket names no host. The
  `pc` hook and the generated pre-push hook previously cut the authority at its
  first colon, collapsing every address sharing a first hextet to the single host
  `[2001` — so an entry naming one address authorized pushes to a DIFFERENT one,
  and those two points were laxer than `gate-push`, which resolved the real
  address (#116)"
- "the push allow-list grammar is now enforced identically at all three enforcement
  points — `gate-push`, the `pc` hook, and the generated pre-push hook — closing the
  window where a mirror was more permissive than the gate (#116). DEPLOY NOTE:
  existing checkouts keep the previously generated pre-push hook, which still uses
  the old substring repo test — the container entrypoint runs `hooks/install.sh`
  only when `.git/hooks/pre-commit` is absent. Re-run `hooks/install.sh` in any
  existing checkout to pick up the new grammar; until then a raw `git push` there is
  gated more permissively than `gate-push`"
