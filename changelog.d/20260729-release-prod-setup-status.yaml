# changelog.d/20260729-release-prod-setup-status.yaml — branch docs/release-prod-setup-status
changed:
- "docs/RELEASE-PROD-SETUP.md now separates GATING receipts from HARDENING items: a release run refuses leg 2 while any gating receipt is unchecked, while hardening items (mirror branch/tag protection, the environment tag-pattern policy, bot key registration, canonical protected tags, PR/collaborator policy) are tracked separately so an open hardening task neither blocks a release nor passes unnoticed. RELEASE-FLOW.md §7 and the docs index are reworded to match. The trusted-publisher receipt is recorded as pre-existing where the project already publishes tokenlessly through the mirror, and the file gains an explicit, auditable place to record a rehearsal WAIVER — rationale plus accepted residual — so skipping the rig for a given release is a recorded decision rather than an unrecorded gap. Also adds a push-allow-entries receipt, which the checklist previously described only in RELEASE-ADOPTION.md, and notes that mirror entries must be written `host/path|refpattern` because the push-by-URL match is anchored"
