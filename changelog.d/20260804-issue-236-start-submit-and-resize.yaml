fixed:
- "Self-dev sessions ran the supervisor from the /workspace checkout instead of the image's code, silently serving whatever routes that checkout had — losing /resize, the rich /healthz and the #210 submit fix whenever the checkout lagged (#236, #230; the #231 measurements were taken against the stale supervisor and need re-running). The runners now pin the supervisor's imports to the operational tree while the agent's own tooling keeps the self-dev view. The fix reaches a session at its next spawn (dev mode) or after an image rebuild (installed mode); already-running sessions keep their stale supervisor until respawned"
- "A 404 from a session's /resize is no longer misreported as \"the image predates the route\" — the daemon reports the observation (this control plane does not serve the route, endpoint named) and logs every message delivery and resize attempt at info level, including attempts that got no HTTP answer at all (#236)"
added:
- "Delivery receipts for writes into a session (#197): the supervisor's /input reply carries the sha256 and length of the payload it received, and the daemon verifies the receipt against what it sent. Every message delivery and resize attempt lands in the platform's events log with endpoint, status and outcome; the durable record carries an HMAC keyed by the session's control token (never an invertible raw hash), and the web terminal's per-keystroke writes are not durably recorded"
- "The supervisor announces which file its code was imported from at startup and in /healthz (source), so a stale control plane is visible instead of inferred from missing routes (#236)"
