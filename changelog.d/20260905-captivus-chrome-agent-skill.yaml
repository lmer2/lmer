added:
- 'A `chrome-agent` skill drives a real Chrome from inside the container over CDP, with the
  escalation ladder, memory budget and teardown rules it needs to be used safely.'
- Xvfb and xdotool ship in the image, so browser work can run headed when a site scores
  behaviour rather than input trust. Headless stays the default.
- '`chrome-agent-launch` starts a browser and records it as the session''s, so the browsers
  a session leaves behind are stopped when it ends and no other session''s are touched.
  Teardown during a run is still the skill''s job.'
removed:
- 'The pre-wired Playwright MCP server and its `mcp__playwright__*` pre-approval. lmer now
  ships no MCP server; Playwright itself and its browsers stay in the image.'
