added:
- 'Unified session communications: supervisor records fan out to connected channels; inbound messages reach the harness with source tags.'
- '`lmer-signal` adds note, post, ask, wait, close and list verbs; bare text remains a milestone.'
- Platform fleet and session communications APIs expose journaled records; connector credentials bind posts to their registered channel.
- The chat pane shows source chips and message kinds across the session conversation; agent posts and relayed inbound messages are drawn once.
- Host Slack and Matrix connectors serve thread targets; both provide standalone entrypoints, and `lmer-matrix-listener` starts sessions from allowlisted mentions.
- Questions accept answers interchangeably from the platform, Slack and Matrix; the first answer wins and is echoed to other channels.
- '`lmer-signal end-session` says goodbye on the bus and ends the session across connected channels.'
- Platform spawns accept thread targets; uber lmer settings persist Slack and Matrix threads across rotations, with independent connectors for every thread.
changed:
- Only `0`, `no`, or `false` disable `LMER_COMMS_TERMINAL_MIRROR`; `off` uses the default and leaves mirroring enabled.
- '`lmer-ctl send` posts a source-tagged bus message; `lmer-ctl command` runs a slash command.'
- Slack bot and Matrix account credentials remain with host connectors and never enter chat containers.
- Containers receive only the control credential digest; the supervisor mints a separate session credential that cannot publish records as a human.
- Thread messages answer questions only through explicit replies, matching options, or the first free-text reply after an optionless question.
deprecated:
- '`lmer-ask` and `lmer-slack post` forward to `lmer-signal` for one release; Slack history, watch and poll yield to automatic inbound turns.'
- Steering through `POST /api/sessions/{id}/input` becomes a bus message for one release; use `POST /api/sessions/{id}/comms`.
fixed:
- An open chat pane no longer draws a message twice when a late transcript row renumbers the conversation underneath it.
- Alternate links to one thread connect once; Slack messages with equal timestamps in different threads remain distinct.
- Invalid Slack timestamps are refused before platform session launch or assistant rotation.
- The assistant's supervisor stamps its own replies as uber lmer without echoing them into its PTY; workers remain agent-origin.
- Connectors wait for supervisor startup; Matrix also replays replies arriving between its history snapshot and initial sync.
- '`lmer-ctl send` accepts path-leading prose; a lone command-shaped token points to `lmer-ctl command` for execution.'
