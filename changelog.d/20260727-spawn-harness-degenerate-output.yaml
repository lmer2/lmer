added:
- "`spawn-harness` now warns when a fan-out child exits 0 while producing nothing at all (#139): a child that dies has always explained itself through its exit code and the `[spawn-harness] child FAILED` footer, but a child that *succeeds* with an empty answer looked identical to a healthy one — clean exit, no footer, an output file that exists — so the orchestrating agent silently consolidated from N-1 agents (the failure mode behind #137, where a child ended its turn asking `Shall I proceed with this fix? (yes/no)` and exited 0; the only tell was the output file's size). After a child exits 0, the captured `--output` is now inspected for three degenerate shapes: an empty file, whitespace-only content, and content below a 10-character floor (kept deliberately low so a legitimately terse `no findings` survives and only stubs like `ok` or `n/a` are flagged). A hit prints a stderr warning naming the agent, the reason and the output path, and appends a `[spawn-harness] child produced NO USABLE OUTPUT` footer to the output file — a distinct marker from `child FAILED`, since the exit code genuinely was 0 and a dropped result calls for a different response than a dead child. All three signals are properties of the bytes: whether prose amounts to a *complete* answer is deliberately not judged, so #137's own halt-and-ask shape is not caught here. A child can halt for any number of reasons phrased any number of ways — an open question with no yes/no framing, or no question at all — and nothing separates a halt from a legitimately terse answer structurally, so every heuristic for it reduced to guessing intent from wording (#153 tracks what the harnesses can report structurally, such as turn-limit truncation; #138 the hook-side session signal). The mirrored exit code is unchanged (a fan-out that treated a terse answer as a hard failure would be worse than the bug), and the check is skipped when no `--output` is given, since a child streaming to stdout leaves nothing to inspect (#152). See 'Non-interactive exec mode' in docs/HARNESSES.md"
