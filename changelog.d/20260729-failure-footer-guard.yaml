fixed:
- "`spawn-harness` no longer replaces a dead child's exit code with a traceback when it cannot write its own failure footer (#151). The three post-exit footer writes — interrupt (SIGTERM/SIGINT), `--timeout` expiry, and a non-zero child exit — went straight to the captured `--output` handle with no error handling, so on a full or read-only filesystem the harness's inability to append a note propagated out and destroyed the exit code the caller depends on: a fan-out child that timed out reported a crash instead of 124, and a failed child reported a crash instead of its own status. The exit code is the one contract `spawn-harness` promises its callers, and it was being lost on exactly the paths where an accurate code matters most. All three writes now warn on stderr (`⚠️  spawn-harness: cannot append the failure footer to <path>`) and leave the code alone — the same warn-don't-raise contract the no-usable-output footer added in #139 already followed. The guard covers the buffered case too, which is the one a full disk actually produces: writes into a buffered handle routinely succeed while the filesystem is full and the `ENOSPC` surfaces only when the buffer drains, so the footer write is flushed inside the guard, and the handle's `close()` — on both the success and failure paths — is guarded the same way rather than being left to clobber the exit code one line later. On the interrupt path the guard deliberately wraps only the footer write, so an interrupt still unwinds to `128 + SIGINT` and a cancelled fan-out is never silently swallowed."
