added:
- "Exposed read-only service-slot holdings across projects and per-project eligibility/current availability, with a link to existing slot management."
- "Added bounded peer UL discovery and standing-instruction reads, plus authenticated native peer messages with explicit session addressing, provenance and durable send receipts."
- "Added named project workspaces with independent uber lmer context, durable assistant admission, project-bound routing, inactive run moves, project navigation/settings, archive/restore and slot applicability."
- "Routed Slack and Matrix bot mentions by case-insensitive leading project name, defaulting unbound plain mentions to General while preserving ownership, durable request receipts and source-thread replies."
fixed:
- "Allowed operator-only retained conversation, terminal-log and ask-history reads for unassigned sessions without granting project or mutation authority."
- "Exposed unassigned recovery entries in operator-wide lists and limited Slack mention-prefix removal to the authenticated bot identity."
- "Kept recovered project assistants visible after platform restart by retiring superseded crash rows from the fleet and distinguishing repository-free session identities, while retaining current failures and history."
- "Retained incoming transport events before acknowledgement, enforced operator-only project sharing and durable request action context, and kept pre-effect refusals retryable."
- "Bound reopened assistant chats to their intended project and retained editable queued drafts alongside previous conversation history."
- "Kept connector-health-only events out of assistant digests and wake-ups while preserving worker conversations and real supervision events."
- "Retained mentions across unavailable Slack identity lookups, added operator parking for uncertain replies without replay, and preserved staged attachments through rotation."
- "Fixed fleet startup reads after legacy-session migration by resolving nested inventory session IDs while preserving existing and unassigned ownership."
- "Kept every project visible in the sidebar, combined project chat and assistant status, compacted the project toolbar, and moved platform settings to the global header."
- "Added All-project completed-run cleanup, accessible global toolbar tooltips, editable collapsed project instructions, colored archive controls, scoped assistant selection, simpler sidebar groups and adjacent numeric capacity inputs; removed redundant project detail badges."
- "Clarified the existing native peer reply and standing-instruction sharing workflow without changing API permissions."
