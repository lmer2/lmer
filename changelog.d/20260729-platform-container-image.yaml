# changelog.d/20260729-platform-container-image.yaml — branch feature/platform-container-image
added:
- "Platform container image (#150): `Dockerfile.platform` ships the orchestrator platform — the FastAPI control plane plus its Vue UI — as its own artifact, separate from the session image agents work in (`Containerfile`). Multi-stage: the UI is built in a `node:24.18.0` stage whose version literal must track `lmer_platform.ui_build.NODE_VERSION` (asserted by `tests/test_platform_image.py`, since `web/dist` is not committed and cannot be copied from the build context), and the runtime is a `python:3.12-slim` with a non-editable `pip install .`, `git` for the work-repo mirror, and Docker's client (`docker-ce-cli` from Docker's own keyring-verified repository — the client only; sessions start through the host's bind-mounted socket) running as a non-root `developer` whose UID/GID come from the `BUILD_UID`/`BUILD_GID` build args (default 1000) so the bind-mounted platform state dir stays writable. `LMER_BUILD_COMMIT` is baked to `/opt/lmer/BUILD_INFO`, `ENTRYPOINT [\"lmer\", \"platform\"]` with `CMD [\"run\"]` makes `docker run <image>` serve and `docker run <image> status` still inspect, and the built bundle is baked at `/opt/lmer/ui` with the new `LMER_PLATFORM_UI_DIST` pointing at it — so a pull replaces the host-toolchain `lmer platform setup-ui` step for containerized deployments. That variable is a bundle location the daemon reads (not a `config.json` field), and it is the first candidate `dist_dir()` tries, ahead of the `setup-ui`-installed copy, so a container mounting the host's platform state dir cannot end up serving a UI built by the host's older lmer; a missing path or a directory with no `index.html` falls through instead of turning the UI off, and unset changes nothing. The bind address is deliberately not baked — the daemon still binds loopback by default (spec D14), so a published port is `-e LMER_PLATFORM_BIND_ADDRESS=0.0.0.0` at run time. See `LMER_PLATFORM_UI_DIST` in docs/LMER-CLI.md"
- "Platform container operator guide and run helper (#150): `docs/PLATFORM-CONTAINER.md` documents running the platform image — the path-identity invariant (the host's `$HOME/.lmer` bind-mounted at the identical absolute path, `HOME` and UID matching, because the session `-v` arguments the containerized platform constructs are resolved by the host's daemon), what to mount beyond `~/.lmer` (harness credential paths, `~/.ssh`, `~/.gitconfig`), why the network namespace is the host's, upgrade-by-pull, and the honest restart caveat (after a platform-container restart, session re-attach is skipped by the pid-based liveness check until the planned epoch/healthz fix lands). `scripts/platform-container-run.sh` encodes all of it — socket resolution for docker and podman, `--group-add` for the socket, credential mounts read-only, env forwarded by name so secrets never enter argv — with `--print` to show the exact `docker run` it would issue. The helper also forwards the git tokens a containerized platform needs, by name (`LMER_WORK_REPO_TOKEN`, `GITLAB_TOKEN`, `GITLAB_TOKEN_<host>`, `GH_TOKEN`/`GITHUB_TOKEN`) — or keep them in `~/.lmer/.env`, which the daemon loads off the state mount — and it reads `~/.lmer/platform/config.json` to name any `lmer_bin`, `secret_file` or `work_repo_mirror` pointing at a host path outside the mounts, with the failure each one causes (ENOENT on every spawn, a re-minted shared secret, a mirror re-cloned into the container's ephemeral filesystem); the matching `LMER_PLATFORM_SECRET_FILE` / `LMER_PLATFORM_WORK_REPO_MIRROR` variables are not forwarded when nothing mounts the path they name. `--runtime-arg` passes a flag to docker/podman itself (arguments after `--` land after the image, so they are read by `lmer platform`), `--socket` names a socket the probe's candidates miss, and the image installs `procps` for the runbook's `ps` step"
