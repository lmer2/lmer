fixed:
- "The `release` taskdef's leg 1 now runs. Its ctl pin moves to the post-MR-!11
  ctl (`5af16cea` at `gh/20c/ctl`), which fixes the two defects that hard-stopped
  the first release attempt: the residual `unreleased:` changelog key is now
  matched case-insensitively (lmer's lowercase key was invisible to the previous
  pin, so 9 parked entries were silently dropped from the roll while the run
  reported success), and `ctl version set <X.Y.Z> .` writes the version with no
  git operations at all — the previous pin's only bump path committed outside
  `gate-commit`, created an unsigned tag under a name leg 2 does not use, and
  pushed both. Leg 1 now names the exact commands it runs (`ctl version set`,
  `ctl changelog release`, `uv lock`), names the forms that are forbidden and
  why, and enumerates the diff it expects — `uv.lock`'s own version line and the
  regenerated `CHANGELOG.md` are declared expected (and staged) rather than
  tripping the step-4 \"nothing else in the diff\" check, while a `uv.lock` diff
  that moves dependencies still stops the run"
- "Leg 1's dry run is now something that exists. It previously told the session to
  consult `ctl --help` for a dry-run invocation; ctl has no dry-run flag, so the
  dry run is now specified as step 4's commands run against a throwaway clone,
  with the changelog result verified by parsing rather than by reading the diff
  (the roll rewrites the whole file, so a partial roll does not stand out
  visually). An already-landed bump — a previous release that died after its bump
  MR merged — is explicitly distinguished from a pin failure: it makes the dry run
  fail, and the old wording would have hard-stopped a release that only needed its
  version recorded"
- "Leg 1's ctl install no longer fails on a missing credential helper. The
  container has none for `git.20c.com` and mounts `~/.gitconfig` read-only, so a
  bare `uv tool install` from that host fails with `could not read Username`; the
  taskdef now spells out the working `GIT_CONFIG_COUNT` form, and records that no
  `Ctl/config.yml` is needed in the target repository"
