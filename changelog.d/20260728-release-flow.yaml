# changelog.d/20260728-release-flow.yaml — branch feature/release-flow
security:
- "Push gate: `gate-push` now authorizes the remote's PUSH url (`git remote get-url --push`) instead of its fetch url. `git push <remote>` uses `remote.<name>.pushurl` whenever it is configured, so a single `git config remote.origin.pushurl <url>` — or a stale entry in a target-repo checkout — previously let a push pass the allow list against one repository and land on another. The generated pre-push hook was already correct here (git hands it the real push url), so this closes a gap between the two enforcement points"
- "Push allow list: the URL a push-by-URL is matched against is now PARSED rather than scanned for `@`. Userinfo is stripped only where it can legally appear — inside the authority of a `scheme://` URL, and before the host of the scp-like `[user@]host:path` form — so a URL carrying the allowed identity in its path (`https://evil.example/x@forge.example/group/project`, `git@evil.invalid:x@forge.example/group/project.git`) resolves to the host git will actually dial and is refused. Path-only entries no longer authorize on this branch either: any forge can serve the same path, so an entry must name `host/path` or the bare `host`. Entries for CONFIGURED remotes are unaffected — that url comes from the operator's own git config and keeps the historical substring rule"
- "The `pc` hook now pushes to the remote it authorized (`git push origin <branch>`). A bare `git push` resolves its remote through `branch.<name>.pushRemote` → `remote.pushDefault` → `branch.<name>.remote`, so either of the first two sent the commit to a remote the allow-list check had never looked at — while the confirmation prompt showed the remote that WAS checked"
- "Pre-push hook: whether a push is treated as push-by-URL is now decided by asking git to resolve the remote, the same way `gate-push` decides it, instead of guessing from the string's punctuation. `git push github.com main` — a bare hostname git does not have as a remote — previously took the CONFIGURED-remote branch in the hook, where the match is an unanchored substring that pins no host, while `gate-push` failed closed. The hook's URL parse also agrees with `gate-push` on two spellings git reads as a local path or refuses outright (`user@host/path`, `://host/path`); both used to normalize to `host/path` there and authorize"
fixed:
- "`gate-push` and the `pc` hook refuse to authorize a push when the current branch cannot be resolved (detached HEAD). `git branch --show-current` exits 0 with empty output there, which used to become the literal ref `refs/heads/` — and `fnmatch` matches that against `refs/heads/*`, so any bare allow-list entry authorized a ref naming no branch"
- "Release runs: a repository can now release more than once. Run identity is derived from `(taskdef, target)`, which is the same string for every release of a repository, so every release resolved to ONE run dir — and once that run was terminal (`complete` after a release, `aborted` after a declined one) `work release claim` refused it permanently and the release taskdef read the non-zero exit as \"end the session\". A release run now moves to a version-bearing address as soon as leg 1 records the version (`release-<repo>` becomes `release-<repo>-v0.6.0`), freeing the seed address for the next release; resolution follows the live run by its recorded identity, so a scheduled or manual relaunch still lands on the in-flight release with no launch parameter carrying the version. `work release claim` also rolls a finished run aside — and seeds its successor in the SAME atomic commit — when one is still parked on the seed address, which covers a release aborted before leg 1, a session that died after completing, and a run closed out by hand. Single-flight is unchanged: a live run still refuses a second session"
- "Release runs: a re-used version no longer wedges a repository. A declined release leaves its bump on `prep-release` and the successor's dry-run skips it, so the successor records the SAME version — while the declined run is already parked on that version-bearing address. The address a run moves to is now guaranteed free (`release-<repo>-v0.6.0-<stamp>` when the plain form is taken) instead of the move being silently skipped, which used to leave the successor on the seed address and refuse the release after it forever. The same guarantee covers named runs, where the run dir is `runs/<slug>--<name>`: the slug is occupied while the path is free, and two runs could previously record one slug for run-dir lookups to choose between by directory sort order"
