added:
- '`lmer-schema validate <path>` checks a work repo against the lmer schema and prints an ordered fix-list:
  exit 0 clean, 1 errors, 2 unusable input. A tree with no manifest is checked at a lenient tier, so its
  output is a migration aid rather than a gate — warnings never block.'
- '`lmer-schema --list-checks` prints every check code with its severity, its legacy-tier severity where
  they differ, and what it reports. `--json` on either command emits one document for tooling to consume.'
- '`_plexus.yaml` support: a work repo can now declare its own schema version, name its projects (each
  with a primary `repo:`, additional `remotes:`, or no remote at all), fold in its `sources:` declarations,
  and set a `housekeeping:` policy. A repo without one keeps working exactly as before.'
- A project named in `_plexus.yaml` gets a short-name directory of its own, so a project with several
  remotes lands in one tree however it was cloned. An unregistered repo's work still lands under `{host}/{project}/`
  and is never renamed automatically.
- '`work sessions [--running] [--json]` lists the launches of a run — id, address, status, phase, and
  whether a record looks orphaned — so a crashed session can be found rather than mistaken for a finished
  one.'
- '`work session-start --session <id>` and `work resume --session <id>` continue a specific earlier launch
  instead of opening a new one.'
- '`lmer --session <id>` starts a container in an existing run record instead of opening a new one: the id
  names one launch inside the run''s group (a session dir''s `<session-id>`, or its full `<session-id>--<name>`
  as `work sessions` prints it), and everything in the container writes there. It is the only source — a
  host-exported or `.env` `LMER_SESSION_ID` is never forwarded, because every lmer container exports one and
  a session that spawned a child would otherwise hand the child its own record. A value that could not be a
  directory name is refused before the container starts.'
- '`lmer platform resume --session <id>` and `lmer-ctl runs resume --session <id>` say which launch of a run
  to continue from a terminal, the way `POST /api/runs/resume` already could. Omitted, both continue the
  newest launch as before; an id that names no launch of that run is refused with the list of the ones there
  are.'
- '`docs/SCHEMA.md`: the normative description of everything lmer reads and writes outside the code repos
  — every path, its writer, whether it is required, and how strictly it is checked.'
fixed:
- '`work log` no longer destroys a run''s worklog when `log.yaml` cannot be parsed. Appending reads the
  whole file, adds the entry and writes it back — and an unparseable or non-list file read as an empty
  list, so the write replaced every entry already in the log with the single new one and `work log`
  printed its success tick over the top. Nothing warned first: displaying the log prints raw lines and
  never parses, so it read fine until the next append emptied it. A corrupt log is now moved aside as
  `log.yaml.bad-<utc>` and the append refuses, the way `release.yaml` has always behaved — a failed
  append that keeps your history beats a successful one that ate it. A file that merely cannot be read
  right now (a permissions or IO problem) is refused without being moved, and an empty file is still
  just the first append.'
- '`lmer-schema validate` no longer reports findings from the legacy `{host}/{project}/{task_type}/{target}/`
  tree, which the schema puts out of scope. A `runs/` directory left inside one made the validator descend
  into it and report its contents as errors, so a tree could fail validation entirely on the strength of a
  location the schema does not check. Recognised by shape rather than by name, because `{task_type}` is
  whatever `LMER_TASK` was and every one of those names is also a legal project name.'
- 'A `_plexus.yaml` that puts `ref:` on a source that does not take one is now warned about. `ref:` is
  `sources.taskdef`''s alone, and a standalone `sources.yaml` has always refused it elsewhere — but the
  manifest accepted it silently, so it sat there taking effect nowhere. Nothing reads the manifest''s
  `sources:` section yet; the warning exists now so that when something does, a manifest already carrying
  one is a warning to fix rather than a tree that refuses to start.'
- 'A run directory move that fails no longer leaves an empty directory sitting on the address it reached
  for. Both the re-slug and the initial seed created the destination before the move and did not remove
  it when the move failed; because a bare directory counts as that slug being taken, the next release run
  then quietly took a stamped address (`<slug>-v1.2.3-<timestamp>`) for a run that had never been
  created. A group directory another launch is already using is never removed.'
- 'In a schema-form work repo, a second launch of one run no longer removes the first launch''s spec from
  the specs index. Index entries were named for the RUN, so two launches that nobody had named composed the
  same entry name and the second one silently re-pointed the first''s entry at its own file (same day) or
  unlinked it outright (any other day) — the spec still on disk, gone from the index, nothing raised and
  nothing logged. Entry names in a schema-form tree now carry the launch''s session id as well, which is
  the one component nobody chooses: `2026-08-25-develop-issue-353-20260824-165230-2-31245--spec.md`. The
  names are longer, deliberately — a long name that names one record beats a short one that hides another.
  Legacy work repos are untouched: one target has one run directory there, so their entry names are exactly
  what they were.'
- 'A run launched through one of a project''s secondary `remotes:` is no longer tracked under one identity
  and listed under another. The launch URL decided the tracked identity while the record''s directory is
  listed under the project''s primary `repo:`, so one directory answered to two keys: the adoption picker
  offered back a run this orchestrator had just started, and adopting it — which the picker invites — gave
  that one directory two rows with separate titles and check-in marks. A second launch through the other
  remote was not recognised as the same run either, so the one-live-session-per-run refusal did not fire.
  The launch URL is now folded to the project''s primary remote where the identity is derived. Best-effort
  throughout: no mirror, no manifest, a manifest this build cannot read, or a URL the registry does not
  know all leave the identity exactly as it was — the fold can cost itself, never the session.'
- 'Resuming a run, or answering one that stopped on a question, no longer opens a fresh empty record beside
  the record it continued. The platform resolved the launch you asked for, checked it, and then started a
  container that minted a new session id — so the run you resumed sat untouched with its question still
  standing, and the work repo grew a second, empty record for it that `work sessions` listed as another
  launch. The resolved record''s id is now handed to the container, which writes in it; a resume that
  overrides the taskdef still starts a sibling run of its own, and legacy work repos are unaffected.'
- 'Container start no longer leaves an empty `<session-id>/` directory beside the record a resumed launch is
  about to write in — a named record (`<session-id>--<name>/`) meant the group showed two directories for one
  launch, with no way to tell which was the run.'
- '`work memory persist` no longer deletes or overwrites memories belonging to other sessions. It used
  to mirror the memory directory into the work repo, so a session that had merely read a memory would
  delete it (if it never had it) or revert someone''s edit to it (if it held an older copy) — a real loss
  on a shared work repo, in both the legacy and the new layout. Persist now merges: it acts only on files
  it was actually handed and has since changed or removed, and a session with no record of what it was
  given deletes nothing at all.'
- '`work memory persist` no longer discards a retirement that empties a memory scope, or leaves a
  retyped memory shadowing its own correction.'
- '`work memory persist` now applies a retirement of every memory at once, instead of leaving them
  all in the work repo.'
changed:
- 'Agent memory now routes by a memory''s own `metadata.type`: `project` memories stay with their project,
  while `user`, `feedback` and `reference` memories go to a work-repo-wide scope shared by every project,
  so a fact about you is recalled everywhere rather than only where you learned it. Recall reads both.
  A work repo without `_plexus.yaml` keeps one scope and behaves as before.'
- In a schema-form work repo each launch owns its own record directory, so two sessions on the same target
  no longer interleave in one directory and either can be resumed by name. The legacy layout is read and
  written exactly as before, in the same place.
- The fleet view, the resume flow and the work CLI read both layouts, so a work repo can be migrated without
  a flag day and mixed states resolve.
- Container start, the session hooks and the harness shells accept the schema's `_agents/claude` and `_agents/mirrors`
  locations alongside the existing `agent-files/` and `mirrors/`.
