- "`lmer-ask` no longer refuses to post at roughly a third of the channel cap (#191). The full-channel check counted every file it recognised, and the parse it borrowed is id allocation's — which deliberately matches the `.answer.json`, `.read.json` and `.closed.json` sidecars a healthy question accumulates, because an id must never be handed out twice. An asked-answered-read question is three files, so a channel of 167 ordinary exchanges counted as 500 `entries` and every later `lmer-ask ask` was refused with a message telling the session it was looping — leaving a long orchestrated session, which is exactly what the channel exists for, with no way to reach its operator and an operator pointed at a runaway session rather than at a full channel. The cap now counts entries only (questions, notes and signals — the shapes that own an id), id allocation is unchanged, and the refusal quotes the count it actually measured instead of quoting the cap."
