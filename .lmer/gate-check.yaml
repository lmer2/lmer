# gate-check configuration for this repo (read by src/lmer_cli/gates.py).
#
# tests.text_diff_subset: the tests that read prose the gate classifies as
# text (*.md, *.rst, changelog.d/ fragments, CHANGELOG.yaml, LICENSE). A
# change touching nothing else runs exactly these instead of the ~10-minute
# full suite (issue #269).
#
# The list is not maintained by hand: tests/test_gate_text_diff_subset.py
# scans tests/ for repo text reads and fails with the paths it is missing.
# Add what it names.
#
# What that scan measures, and what it does not: it models repo-anchored
# pathlib composition (`REPO / 'docs' / 'x.md'`, `joinpath`, `glob`/`rglob`)
# and the conftest fixtures that hand out repo paths. It does NOT see
# `os.path.join`, f-string paths, `os.walk`, `glob.glob`, `iterdir`,
# cwd-relative `open('README.md')`, or a test that shells out to a repo
# script which reads a doc. So this list is a FLOOR: a scan that finds
# nothing new is not proof that the subset is complete.
#
# As of this commit the subset IS complete, by hand-audit rather than by
# mechanism: the undeclared modules that reach a REAL repo path through an
# unmodelled idiom reach paths this list does not call text
# (test_fips_compliance.py opens a cwd-relative fips-requirements.txt,
# test_lmer_cli_gitlab_pipeline.py os.path.joins bin/gitlab-pipeline, the
# lmer smoke tests exec ./lmer), and every other unmodelled idiom in tests/
# addresses tmp_path. That is a measurement of today's tests. A test added
# with an unmodelled idiom against a doc must be listed here by hand —
# nothing will ask for it.
tests:
  text_diff_subset:
    - tests/test_assistant_mentions_review.py
    - tests/test_agent_defs.py
    # Reads agent-files/claude/skills/chrome-agent/SKILL.md: the skill's
    # hazard and ladder assertions live there, so a prose-only edit to it
    # must run them.
    - tests/test_browser_automation_wiring.py
    - tests/test_codex_usage.py
    - tests/test_consistency.py
    - tests/test_containerfile.py
    - tests/test_doctor_sources.py
    - tests/test_gate_cache.py
    - tests/test_gate_concurrency.py
    - tests/test_gate_inflight_hold.py
    - tests/test_gate_inflight_lock.py
    - tests/test_gate_text_diff_subset.py
    - tests/test_gates.py
    - tests/test_harness.py
    - tests/test_harness_runners.py
    - tests/test_import_provenance.py
    - tests/test_integration.py
    # Reads docs/SCHEMA.md: TestTheCodeTableMatchesTheDocument asserts the
    # registered check codes and the document's table match both ways, so a
    # text-only edit to SCHEMA.md must run it.
    - tests/test_lmer_schema_cli.py
    - tests/test_lmer_schema_manifest.py
    - tests/test_masterplan_provisioning.py
    - tests/test_performance.py
    - tests/test_platform_ask.py
    - tests/test_platform_image.py
    # Reaches docs/LMER-CLI.md through `Path(__file__).resolve().parents[1]`,
    # an idiom the scanner does not model — found by hand-audit during #353,
    # exactly the case the header above warns this list is a floor for.
    - tests/test_platform_nudge.py
    # Reads docs/PLATFORM-QUICKSTART.md and docs/LMER-CLI.md through
    # `Path(__file__).resolve().parents[1]` — the same unmodelled idiom as its
    # sibling above, listed by hand for the same reason.
    - tests/test_platform_rotation.py
    # Reads docs/LMER-CLI.md (the LMER_STATUS_DIR bullet) through
    # `Path(__file__).parent.parent`, an idiom the scanner does not model —
    # listed by hand, as the header above says such a test must be.
    - tests/test_statusline.py
    # Reads docs/COMMS.md's §1 `meta` row: the reserved-key set is asserted
    # against the keys that row names, so a text-only edit to it must run this.
    - tests/test_supervisor_comms.py
    - tests/test_platform_web_app.py
    - tests/test_platform_web_assistant.py
    - tests/test_platform_web_bundle.py
    - tests/test_platform_web_composer.py
    - tests/test_platform_web_markdown.py
    - tests/test_platform_web_markdown_surfaces.py
    - tests/test_platform_web_theme.py
    - tests/test_release_taskdef.py
    - tests/test_rules_structure.py
    - tests/test_run_state_wiring.py
    - tests/test_security.py
    - tests/test_self_dev_pythonpath.py
    - tests/test_signal_guard.py
    - tests/test_supervisor.py
    - tests/test_taskdef_render_matrix.py
    - tests/test_user_harnesses.py
    - tests/test_work_repo_release_run.py
    - tests/test_work_repo_run_state.py
    - tests/test_workrepo_isolation_guard.py
