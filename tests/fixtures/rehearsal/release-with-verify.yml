# Fixture: a release workflow with the expected shape (see
# Ctl/rehearsal/derive-workflow.py --check). Mirrors the production
# .github/workflows/release.yml but keeps the main-HEAD assertion inline so
# the suite stays hermetic (no repo-script resolution outside a real
# .github/workflows layout), and carries a project-name reference in the
# github-release job to exercise transform rule 3.
name: Release to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify-tag-signature:
    name: Verify tag signature and main head
    runs-on: ubuntu-latest
    steps:
      # Pinned to main, never the pushed tag's ref (the verifier must not
      # come from the tree it verifies).
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      # `fetch-tags` only leaves tag auto-following on; a tag off `main`
      # may not come down with it, so the ref is fetched explicitly.
      - name: Fetch the pushed tag explicitly
        run: |
          git fetch --no-tags origin \
            "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Verify tag signature
        env:
          RELEASE_ALLOWED_SIGNERS: ${{ vars.RELEASE_ALLOWED_SIGNERS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag_commit=$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")
          [ "${tag_commit}" = "${GITHUB_SHA}" ]
          main_sha=$(curl --fail -s "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/heads/main" | jq -er '.sha')
          [ "${tag_commit}" = "${main_sha}" ]

  build:
    name: Build wheel and sdist
    needs: verify-tag-signature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build distributions
        run: uv build

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/lmer/
    permissions:
      id-token: write
    steps:
      # The gate script comes from main, never the pushed tag, and the
      # checkout precedes the download (checkout cleans its workspace).
      - uses: actions/checkout@v6
        with:
          ref: main
          sparse-checkout: .github/scripts

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Version-reuse gate; its PYPI_PROJECT_URL is a transform contract
      # (rewritten to the TestPyPI project url).
      - name: Gate version reuse
        env:
          PYPI_PROJECT_URL: https://pypi.org/project/lmer/
          RELEASE_RESUME_VERSION: ${{ vars.RELEASE_RESUME_VERSION }}
        run: .github/scripts/gate-version-reuse.py

      # Pinned to an exact commit SHA (comment must survive derivation
      # verbatim).
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
        with:
          skip-existing: true

  github-release:
    name: Create lmer GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: lmer release built from the signed tag
          files: dist/*
          generate_release_notes: true
