# Fixture: a release workflow WITHOUT the expected shape — no
# verify-tag-signature job at all, and the publish step lacks
# skip-existing. derive-workflow.py --check must fail loudly on this.
name: Release to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build distributions
        run: uv build

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/lmer/
    permissions:
      id-token: write
    steps:
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
