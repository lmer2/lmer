name: Release to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Tests gate: the repository's own CI workflow, run on the tagged commit. A
  # tag on a red commit fails here before anything is built or published.
  checks:
    name: Run CI checks
    uses: ./.github/workflows/checks.yml

  # Build holds no token. `uv build` runs the tagged tree's own build hooks,
  # so keeping it out of the job that mints the OIDC token means the
  # privileged job runs no repository code at all and needs no checkout.
  build:
    name: Build wheel and sdist
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged tree
        uses: actions/checkout@v6
        with:
          # Full history so a tag-derived version (setuptools-scm, once
          # adopted) resolves; a wrong version costs a release, this costs
          # seconds.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      # Until the version is derived from the tag, the tag and pyproject.toml
      # must agree; a mismatch here is a release that would publish the wrong
      # number. This step goes when setuptools-scm lands (#335).
      - name: Check the tag matches the version in pyproject.toml
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pyver=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${tag}" != "${pyver}" ]; then
            echo "::error::Tag version '${tag}' does not match pyproject.toml version '${pyver}'"
            exit 1
          fi
          echo "Tag and pyproject version match: ${tag}"

      - name: Reproducible timestamps
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Build distributions
        run: uv build

      # Both gates run here, before publish-pypi and before anything
      # authenticates, because reaching the publish job red spends the version
      # AND the tag, neither of which this repo re-cuts.
      #
      # Only the first has a pre-tag copy. The canonical GitLab pipeline runs
      # check_build_constraint.py in its build-package job (merge requests,
      # default branch and tags), so backend drift is normally caught on the
      # merge request and this run is the backstop. publisher_metadata_gate.py
      # has no pre-tag copy deliberately: it fetches the publish action's
      # requirements/runtime.txt from raw.githubusercontent.com at the pinned
      # action SHA and builds a throwaway env with uv, so putting it in the MR
      # pipeline would make every merge request depend on GitHub being
      # reachable. Its subject — the publisher's own twine — also only matters
      # against the distributions actually being published.
      #
      # check_build_constraint.py is stdlib-only; publisher_metadata_gate.py
      # needs uv and network.
      - name: Check the build constraint bound
        run: python ci/check_build_constraint.py

      - name: Check the distributions with the publish action's own twine
        run: python ci/publisher_metadata_gate.py

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      # The required reviewer on this environment is the human gate; it lives
      # in repository settings, not here.
      name: pypi
      url: https://pypi.org/project/lmer/
    # A job-level block REPLACES the workflow-level one rather than merging
    # with it. This job needs only the OIDC token: no checkout, no repository
    # code, no `contents` scope at all.
    permissions:
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # SHA-pinned (version in the comment; bump both together). The action
      # runs a container image tagged with THIS SHA, whose dependencies were
      # pinned at image-build time by `requirements/runtime.txt` from the same
      # commit. The twine in that set inspects the distributions — v1.12.4
      # carried packaging 24.2, which understands Metadata-Version only up to
      # 2.4, and rejected a 2.5 wheel here after trusted publishing had already
      # authenticated (ctl #44). v1.14.2 is the first release carrying twine
      # 7.0.0 / packaging 26.2, which accept 2.5. The pre-publish gate in the
      # build job installs that same file at that same SHA and checks with what
      # it gets (ci/publisher_metadata_gate.py), so it runs what this step runs
      # by construction — there is no second copy of these versions in the
      # repository to fall out of step.
      # No `skip-existing`: an upload refused for a version that already exists
      # is the signal we want, not something to swallow. PEP 740 attestations
      # are this action's default under trusted publishing; stated explicitly
      # so a bump cannot silently drop them.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true

  github-release:
    name: Create GitHub Release
    # Runs only after the upload was accepted: a Release pointing at a version
    # that failed to publish is worse than no Release.
    needs: publish-pypi
    runs-on: ubuntu-latest
    # `contents: write` is what creates the Release, confined to this job.
    # `actions: read` lets the artifact download below use the run-scoped REST
    # listing (see the step comment).
    permissions:
      contents: write
      actions: read
    steps:
      # This step is the partial-release recovery path: "Re-run failed jobs"
      # after publish-pypi succeeded re-runs only this job and must still find
      # the `dist` artifact from the original attempt. Without a github-token
      # the download uses the internal artifact backend scoped by the runtime
      # token, which is attempt-sensitive and has 404'd in exactly this
      # scenario (actions/download-artifact#486). Passing the token forces the
      # run-scoped REST lookup, which is attempt-agnostic.
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.run_id }}

      # SHA-pinned like the publish action — it runs with `contents: write`.
      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
