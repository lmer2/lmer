name: Checks

on:
  workflow_call:

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run pytest
        # `slow` tests build/run containers (see pyproject.toml [tool.pytest.ini_options]
        # markers); hosted GitHub runners don't have Docker-in-Docker configured the way
        # .gitlab-ci.yml does, so we deselect them here. Container tests are still covered
        # by the GitLab pipeline.
        run: uv run pytest tests/ -v --cov=src --cov-report=term-missing -m "not slow"
