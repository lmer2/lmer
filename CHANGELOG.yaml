# lmer change log
#
# Entries under `unreleased` accumulate between releases. Issue numbers
# referenced in older entries (e.g. `#19`–`#36`) are from the project's
# pre-open-source GitLab tracker and are kept here for historical context;
# new entries should reference GitHub issues at
# https://github.com/lmer2/lmer/issues.

unreleased:
  added:
    - "`lmer --env-file PATH`: load an additional `.env` file as the highest-priority `.env` source (above the working-directory `.env` and `~/.lmer/.env`, which still load; below variables already exported in the environment). Its variables are forwarded into the container like any other `.env`-sourced var; a path that does not exist is warned and skipped. `lmer-slack-listener` gains a matching `--lmer-env-file PATH` flag (also settable via `LMER_SLACK_CHAT_ENV_FILE`) that passes it through to every spawned `lmer chat`, so variables that live only in the listener's deployment `.env` — git tokens such as `GITLAB_TOKEN_<host>`, `LMER_*` settings, … — reach the chat container even though sessions spawn from a scratch working directory with no `.env` of their own. When neither is set, spawning and container-env construction are unchanged (#75)"
    - "`lmer-slack end-session`: a Slack chat session can now end itself on demand instead of holding its slot until the idle timeout runs out. When the human signals the conversation is over, the agent posts an optional goodbye and runs `lmer-slack end-session`, which signals the in-container `lmer-supervisor` (via `LMER_SUPERVISOR_PID` / `SIGUSR1`) to quit Claude cleanly; the resulting clean process exit makes the host orchestrator's reaper free the session slot immediately. The supervisor injects Claude's quit chord (Ctrl-C twice), escalates to SIGTERM/SIGKILL only if that doesn't take, and always reports a clean exit so no crash notice is posted. Exits 3 when there is no supervisor to signal (`LMER_DISABLE_SUPERVISOR=1`), leaving the idle timeout as the fallback (#70)"
    - "GitLab `work_items` issue URLs (e.g. `https://gitlab.example.com/group/project/-/work_items/70`) are now accepted as task targets, treated identically to the older `/-/issues/70` form — newer GitLab installs surface issues under `/-/work_items/`. The base repo URL is derived correctly from such targets and the target normalizes to `issue-<id>` so a work_items URL and its equivalent issues URL share the same work-repo path and logs (#72)"
    - "`lmer-slack-listener`: a host-side Slack listener that spawns one `lmer chat <thread-permalink>` session per thread when the bot is mentioned or DMed, then tracks its lifecycle (idle-timeout disconnect with a reconnect hint, crash detection, capacity limits, graceful shutdown). The listener runs on the host (not in a container, since it launches a container per session) and never relays conversation content — the spawned agent does all Slack I/O via the in-container `lmer-slack` CLI. Requires `SLACK_BOT_TOKEN` and `SLACK_APP_TOKEN` (socket mode); configured via `LMER_SLACK_CHAT_IDLE_TIMEOUT_MINUTES`, `LMER_SLACK_CHAT_MAX_SESSIONS`, `LMER_SLACK_CHAT_BIN`, `LMER_SLACK_CHAT_CWD`, `LMER_SLACK_CHAT_LOG_DIR`, and `LMER_SLACK_DM_ALLOWED_USERS`. Carries no product-specific commands — every non-bot mention/DM connects a chat session. See the 'Spawning sessions automatically' subsection in docs/LMER-CLI.md (#66)"
    - "`lmer chat` Slack-thread integration: pass a Slack thread permalink as a target and the chat task conducts the conversation over that thread via the new in-container `lmer-slack` CLI (`history`/`post`/`poll`/`watch`). The permalink can accompany a repo URL or be the sole target — in the latter case, when no git origin can be inferred from the current directory, the session runs without a repository (container skips the workspace clone via `LMER_NO_REPO=1`). Requires `SLACK_BOT_TOKEN`; see the 'Slack Thread Chat' section in docs/LMER-CLI.md for app setup (#54)"
    - "`lmer-slack post` now accepts the message body via `--message-file PATH` or `--stdin` (`-` is an alias for `--stdin`) in addition to the positional argument. The body is read verbatim, bypassing the shell — fixing silent corruption of messages containing backticks (shell command substitution blanked them out), `$`, or quotes when posted via `lmer-slack post \"…\"`. The chat taskdef now directs the agent to use these modes for replies (#54)"
    - "`lmer-slack watch` subcommand: continuously long-polls a thread and streams each new human message as a single JSON line (`{ts,user,text}`) to stdout, optionally teeing to a `--out` file; bot/self/parent messages are filtered out and a persisted cursor lets a restarted watcher resume instead of replaying. Because it runs indefinitely behind a monitor, transient Slack errors (network blip, 5xx, 429-exhaustion) during a fetch are logged and retried with capped exponential backoff rather than terminating the stream, while a bad/revoked token still fails fast at startup. The chat taskdef now drives replies via `/monitor` on `lmer-slack watch` (messages arrive as events, including mid-task) rather than the agent blocking in `poll`, with `poll` retained as a fallback. The Slack taskdef also now requires a one-line acknowledgment before starting any non-trivial work (#54)"
    - "Slack-bridged chat sessions now have a turn-end guard against replying into the void: a Claude Code `Stop` hook (`hooks/slack_reply_guard.py`) detects when the agent finishes a turn having produced a real reply but no `lmer-slack post` — i.e. the reply went to the (normally unattended) terminal instead of the Slack thread the human reads — and re-prompts it to post. It is a no-op outside Slack mode, nudges at most once per turn, and fails open. The chat taskdef now leads with the two-channels model and frames routing every human-facing reply through `lmer-slack post` as an invariant independent of whether anyone is watching the terminal (#54)"
    - "`LMER_LLM_NAME` environment variable to start Claude with a specific model (e.g. `sonnet`, `opus`, or a full model ID); the value is passed verbatim to claude's `--model` flag. When unset, Claude Code's default model is used (#64)"
    - "`LMER_MOUNT_UV_CACHE` environment variable to bind-mount the host's `uv` cache directory into the container at `/home/developer/.cache/uv` so target-repo `uv sync`/`uv pip install` reuse already-downloaded wheels across sessions. Off by default; host path resolved via `$UV_CACHE_DIR` → `$XDG_CACHE_HOME/uv` → platform default (`~/.cache/uv` on Linux, `~/Library/Caches/uv` on macOS); missing host cache logs an info message and is skipped (#62)"
    - "`LMER_PERSIST_AGENT_MEMORY` environment variable to persist Claude Code agent memory to the work repo on a per-project basis (stored under `{host}/{project}/memory/`). Memory is restored automatically at session start; the agent persists it back via the new `work memory persist` command. Restore and persist use mirror semantics, so memory the agent deletes does not get resurrected on the next restore (#56)"
    - "Apache-2.0 `LICENSE` at the repo root"
    - "GitHub Actions workflow (`.github/workflows/ci.yml`) running pre-commit and pytest on push/PR for `main` and `prep-release`"
    - "`lmer build --update-claude` flag to force re-install of Claude Code CLI during image build (busts Docker cache for the install layer)"
    - "`/followup` slash command that loads per-task-type follow-up instructions from a `followup.txt` file alongside `instructions.txt` in the active task definition directory (#20)"
    - "gitlab-review: issue discussion support — post comments (`--issue-comment-file`), read discussions (`--issue-comments`, `--all-issue-comments`), and reply to threads (`--reply-issue-thread`)"
    - Documentation provisioning — AGENTS.md and rules/ files are automatically provided from lmer defaults or work repo when the target repository doesn't have them
    - Layered override hierarchy for documentation (lmer defaults < work repo project info < project repo)
    - Gate-check warns when provisioned lmer defaults are in use instead of project-native documentation
    - Changelog gate check warns when no changelog file exists or hasn't been updated
    - Jinja2 template (changelog.jinja2) with changelog maintenance instructions for task definitions
    - "`--show-env` CLI flag to display LMER environment variable configuration on startup with source tracking"
    - "`LMER_REASONING_EFFORT` environment variable to override Claude's reasoning effort (`low`/`medium`/`high`/`max`/`auto`); translates to claude's `--effort` flag (#27)"
    - "`LMER_HUMAN_IDENTITY` environment variable communicates the human user's identity (free-form string) into the session; auto-derived from the host's `git config --global user.name`/`user.email` when unset, and injected into Claude's system prompt so the model can recognize the user in PR/MR/issue artifacts without asking them to confirm (#28)"
    - Auto-allow Skill() calls for start, rgr, test, and doctor so agents no longer prompt for permission when these slash commands are user-invoked
    - "Auto-allow the service-mode `target-exec` and `target-logs` wrapper scripts so agents no longer prompt for permission when running commands or tailing logs in the target service container (#6)"
    - WebFetch permission for GitHub domains (github.com, docs.github.com, raw.githubusercontent.com, api.github.com)
    - AGENTS.md section on efficient command usage — guidance to avoid compound commands, use dedicated tools, and keep gate-commit messages simple
    - "gate-check: projects can now ship a `gate-check-run-tests.sh` script in their work-repo `info/` (or `{task}/info/`) directory to override the default pytest invocation; useful for `--service` mode and projects with non-trivial test environments (#30)"
    - "gate-check: pre-commit invocation now falls back to `uv run pre-commit` (uv.lock + `uv` on PATH) or `poetry run pre-commit` (poetry.lock + `poetry` on PATH) when `.venv/bin/pre-commit` is missing, before falling through to a bare `pre-commit`. The venv-binary check also verifies the script's shebang interpreter exists, so a bind-mounted host venv whose interpreter path doesn't resolve in the current filesystem (e.g., host `.venv` mounted into a container) correctly falls through to the manager fallbacks instead of producing a misleading ENOENT on the script itself"
    - "Claude is now wrapped by an `lmer-supervisor` PTY process so a controlling Python process can read/write its stdin/stdout (#31)"
    - "`--fastapi` CLI flag exposes a FastAPI endpoint inside the container with `POST /input` and `GET /output` for programmatic interaction; the endpoint is bearer-token protected and the chosen port is published to `127.0.0.1` on the host"
    - "`--fastapi-port-range`, `--fastapi-host`, and `--fastapi-token` flags configure the FastAPI bind. The host CLI picks one free port from the range (default 8700-8799) before container start and publishes only that single port, letting multiple parallel `lmer ... --fastapi` sessions coexist with default flags. The bearer token (auto-generated when `--fastapi-token` is omitted) is exported to the in-container environment as `LMER_FASTAPI_TOKEN`"
    - "`/start` is now auto-injected into Claude on launch so a task begins immediately; disable with `--manual-start` or `LMER_MANUAL_START=1`"
    - "`--prompt` CLI flag (forwarded as `LMER_START_PROMPT`) injects an immediate follow-up prompt right after the auto-`/start`, so an automated run can hand Claude an extra instruction without manual typing (e.g. `lmer chat <issue-url> --prompt=\"research X online first\"`); ignored under `--manual-start`. The follow-up prompt's submit Enter gets the same bare-CR nudge re-submission as `/start` (governed by `LMER_AUTO_START_NUDGE_DELAY`) in case the initial CR is swallowed during a startup re-render (#50)"
    - "`lmer-pipe` helper CLI for talking to the supervisor's FastAPI endpoint without curl pipelines. Subcommands `send`, `read`, `follow`, `health` read `LMER_FASTAPI_PORT`/`LMER_FASTAPI_TOKEN` from the environment by default and turn common interactions into one-liners (`lmer-pipe send '/start'`, `lmer-pipe follow --from-end`, etc.)"
    - "`--no-supervisor` CLI flag (and `LMER_DISABLE_SUPERVISOR=1` env var) bypasses `lmer-supervisor` and execs `claude` directly. Debug aid for bisecting rendering issues attributable to the PTY wrapper"
    - "`--ports N` CLI flag (and `LMER_PORT_COUNT` env var) allocates N free host ports and publishes them into the container so a service Claude runs inside (e.g. a dev web server) is reachable from the host. The pool to pick from is set with `--port-pool LOW-HIGH` (or `LMER_PORT_POOL`, default `8800-8899`, distinct from the FastAPI range so both can be used together). The host CLI picks the ports before container start — so parallel `lmer` sessions get disjoint ports without coordination — publishes each to `127.0.0.1`, and exports the list to the container as `LMER_PORTS`; startup aborts if not enough free ports are available (#57)"
    - "`--port-bind <addr>` CLI flag (and `LMER_PORT_BIND` env var) overrides the host bind address used when publishing `--ports`/`LMER_PORT_COUNT` mappings (default `127.0.0.1`). Set to `0.0.0.0` to expose the allocated ports on every host interface — useful when another machine on the LAN needs to reach a service Claude runs inside the container — or to a specific interface IP. The free-port probe runs on the same address so the picked ports are guaranteed bindable there. The loopback default is intentional; only widen the bind when you trust the network and what the agent is running (#59)"
    - "gate-check secrets ignore list — optional `gate-check.yaml` in the work-repo project info directory (`{host}/{project}/info/`) lets a project allowlist files that produce false positives in the secret scan. Whole-file globs under `secrets.ignore`; missing/malformed config is silently ignored (#33)"
    - "Work-repo taskdef loading — task definitions can now be loaded from the work repo in addition to the baked-in global taskdefs. Project-scoped taskdefs live at `{work_repo}/{host}/{project}/taskdef/<task>/` and apply only when working on that project; work-global taskdefs at `{work_repo}/taskdef/<task>/` apply to all projects. Precedence (first match wins): project > work-global > `LMER_TASKDEF_PATHS` > built-in, so a project can ship a customised `develop` taskdef that shadows the built-in one (#42)"
    - "Built-in `chat` taskdef — ships in `taskdef/chat/` so `lmer chat <repo>` works out of the box without an external taskdef path (#44)"
    - "`docs/TASKDEFS.md` — authoring guide for taskdefs: format, Jinja2 context, shared partials, recurring patterns (#44)"
    - "`LMER_QUICK_GATE_COMMIT=1` env var skips the slow test suite during `gate-commit` (other checks still run; tests are still enforced by `gate-check` and `gate-push`) (#43)"
    - "Provider-agnostic work-repo token: new `LMER_WORK_REPO_TOKEN` env var is the canonical dedicated work-repo token, supersedes the GitLab-only `GITLAB_TOKEN_worklog` (kept as a deprecated fallback) and works for GitLab, GitHub, and self-hosted hosts"
    - "GitHub token fallbacks: `GH_TOKEN` (preferred) and `GITHUB_TOKEN` are now consulted for `github.com`, `*.github.com`, and `*.ghe.com` (GitHub Enterprise Cloud) hosts, after host-specific `GITLAB_TOKEN_<host>` and before the generic `GITLAB_TOKEN`"
    - "`github-review` tool — thin wrapper around `gh` that fills the one workflow `gh` has no clean native equivalent for: atomic inline-review submission (`--review-file`, N file/line comments + summary in one call) using the same JSON contract as `gitlab-review --review-file`. Normalized read-side passthroughs (`--info`, `--comments`, `--all-comments`, `--issue-info`, `--issue-comments`, `--list`, `--resolve-thread`) emit JSON shaped close to `gitlab-review --json` so consumers don't have to branch on provider. Per-host token resolution via `GH_TOKEN_<sanitized_host>` mirroring the existing GitLab pattern, with fallback to `GH_TOKEN`/`GITHUB_TOKEN`. Use `gh` directly for create/edit/close/comment — the wrapper intentionally does not re-implement those (#47)"
    - "`/github-review-docs` and `/github-review-post-review` slash commands matching the gitlab-review pair (#47)"
    - "`Bash(gh:*)` and `Bash(github-review:*)` added to the allowed-tools list in `/start` and `/followup` so agents can use the GitHub toolchain without permission prompts (#47)"
    - "Work-repo Claude assets — an optional `agent-files/claude/` directory at the work-repo root can contribute slash commands (`commands/<name>.md`), skills (`skills/<name>/SKILL.md`), and permission grants (`settings.json`, `permissions.allow` only) to the session. Work-repo entries override global ones on name collision; only the `permissions.allow` list is honored from a work-repo `settings.json`, so a project cannot weaken global protections (#48)"
    - "Taskdef templates now receive `is_github` / `is_gitlab` booleans in the Jinja2 context, derived from the main task target's host (`LMER_REPO_HOST`, falling back to the host parsed from `LMER_TASK_TARGET` / `LMER_REPO_URL`). Lets `instructions.txt` / `followup.txt` branch on the review interface — e.g. instruct the agent to use `github-review` vs `gitlab-review` — without inspecting raw env vars (#47)"
    - "`LMER_GIT_USER_NAME` / `LMER_GIT_USER_EMAIL` environment variables override the git identity that in-container commits are authored/committed under. The entrypoint exports them as git's native `GIT_AUTHOR_*`/`GIT_COMMITTER_*` vars (session-scoped, mutating no file — the bind-mounted `~/.gitconfig` is left untouched). Either may be set independently; the unset half falls back to gitconfig. Distinct from `LMER_HUMAN_IDENTITY`, which only affects system-prompt attribution (#55)"
    - "gate-check now writes a full investigation log to `/tmp/gate-check.log` (overwritten each run) containing every check's status, message, details, and the complete captured output of the slow checks (Python tests, pre-commit). The path is printed at the end of every `gate-check`, `gate-commit`, and `gate-push` run, so a failure can be investigated by reading the log instead of re-running the suite with `--verbose`/`grep` (#53)"
    - "`LMER_PIDS_LIMIT` environment variable overrides the container PID cap passed as `--pids-limit` to `docker`/`podman run` (default `512`). Accepts a positive integer or `-1` for unlimited; other values warn and fall back to the default. Mitigates the cgroup-v1 pids-controller counter leak on older host kernels (e.g. RHEL 8 / 4.18) where phantom fork entries accumulate over a long session and prematurely exhaust the cap. Documented with recovery and permanent-fix guidance under Troubleshooting in `docs/LMER-CLI.md` (#49)"
  changed:
    - "Packaging metadata updated for open-source release: `pyproject.toml` now declares `license = \"Apache-2.0\"`, an `authors` block (`20C, LLC`), `Development Status :: 3 - Alpha`, and full `Homepage`/`Repository`/`Documentation`/`Issues` URLs pointing at https://github.com/lmer2/lmer; the project ships with an Apache-2.0 `LICENSE` file"
    - "Dependency `dotenv>=0.9.9` corrected to `python-dotenv>=1.0.0` (the `dotenv` PyPI package was an unrelated/abandoned shim)"
    - "Work repository is now cloned to `/work` instead of `/workspace/work`, so it no longer lives inside the target project repo (#21)"
    - Renamed container image from claude-global-rules:fips to lmer
    - Version-tagged container images derived from install method (git SHA, PEP 610 commit, or package version)
    - Default to registry pull instead of clone-and-build fallback
    - Improved Containerfile layer caching (dependency files first, source last)
    - Image tag resolution failure is now a hard error — set LMER_IMAGE env var as override if needed
    - Renamed `lmer rebuild` to `lmer build`; now passes --pull to docker build by default
    - Run `lmer build --force` required to delete existing image before building (previously always deleted)"
    - Renamed CLAUDE.md to AGENTS.md; content is now injected via --append-system-prompt-file instead of Claude Code auto-discovery
    - User-specific additions can be placed in ~/.lmer/AGENTS.md (appended after workspace config)
    - "Quick start docs (README, docs/LMER-CLI.md, docs/AUTHENTICATION.md) now reflect the typical org workflow: install from `prep-release` (latest features) or `main` (stable), and authenticate Claude via subscription credentials (host `~/.claude/.credentials.json`) with API key as the alternative (#32)"
    - "gate-check secret scan now only inspects git-tracked files (via `git ls-files -z`) instead of walking the entire working tree, eliminating false positives from git-ignored / vendored dependencies. Untracked files are already blocked from commit by the git-status gate, and any file staged for commit appears in the git index, so the set of scanned files still covers exactly what can be committed. Outside a git repository the scan falls back to inspecting every matching file as before"
  fixed:
    - "Slack chat integration robustness: `SlackClient.post_message`/`auth_test` now raise a typed `SlackError` instead of a bare `KeyError` when an `ok: true` response is missing its `ts`/`user_id` field, so the CLI's `except SlackError` reports it cleanly; `lmer-slack-listener` validates `SLACK_APP_TOKEN` up front (alongside `SLACK_BOT_TOKEN`) so the `asyncio.run` guard can stay narrowed to `KeyboardInterrupt` and genuine programming errors surface as real tracebacks rather than being disguised as config errors; the per-thread permalink fetch is bounded by a timeout so a hung `chat_getPermalink` can no longer serialize all new-thread connects under the connect lock; and a self-exited session is now routed through the same drain-task reconcile as `terminate()`, so the PTY drain thread and `master_fd` can't leak when a grandchild holds the slave PTY open past the lmer parent's exit (#54)"
    - "`--prompt`/`LMER_START_PROMPT` follow-up prompt no longer collides with `/start` on slow systems. Previously the prompt was injected after only a single nudge-delay gap, so when `/start` had not yet been recognized as a slash command the prompt text landed on the same input line (`/start <prompt text>`) instead of as the next turn. The gap is now a dedicated, configurable delay (`--start-prompt-delay` / `LMER_START_PROMPT_DELAY`, default `2.0s`) that gives `/start` time to register first; raise it on slower hosts (#65)"
    - "`LMER_AUTO_START_DELAY` exported on the host is now forwarded into the container. It was read by `lmer-supervisor` inside the container but missing from the host CLI's container-env passthrough dict in `cli.py`, so a host-exported value was silently ignored (the supervisor kept using the 1.5s default); setting it via a `.env` file still worked. Now follows the same passthrough convention as its sibling `LMER_AUTO_START_NUDGE_DELAY`, and is documented in `docs/LMER-CLI.md` (#52)"
    - "CI: GitHub Actions workflows (`ci.yml`, `checks.yml`, `release.yml`) now declare an explicit top-level `permissions: contents: read`, scoping `GITHUB_TOKEN` to least privilege and resolving the CodeQL \"workflow does not contain permissions\" code-scanning alerts. The elevated job-level grants in the release pipeline (`publish-pypi` `id-token: write`, `github-release` `contents: write`) are unchanged"
    - "CI: `build-container` and `publish-container` jobs no longer fail at `docker login` on Kubernetes GitLab runners. The dind service container does not share its `/certs/client` volume with the build container on the Kubernetes executor, so TLS was disabled in favor of plaintext communication over `tcp://localhost:2375` inside the pod (#45)"
    - "service mode: `--service NAME` now resolves containers via exact match on the Docker Compose service label (`com.docker.compose.service=NAME`), with fallback to exact container name. Docker's `--filter name=` is a substring match, which previously caused `--service myapp` to pick `myappdev-database-1` instead of `myappdev-myapp-1`; substring matches are now rejected with a clear error rather than silently selected"
    - "gate-check pre-commit: dropped the `uv run pre-commit` / `poetry run pre-commit` fallbacks from `_resolve_precommit_command`. Both `uv run` and `poetry run` sync the project's full dependency set before executing the command, so for any project whose runtime deps require system libraries the gate environment can't build (e.g. `mysqlclient` without MySQL dev headers), the sync failed before pre-commit was ever invoked and gate-check reported a misleading 'Pre-commit Hooks' failure that had nothing to do with hooks. New chain: `.venv/bin/pre-commit` if launchable, else bare `pre-commit` from PATH. Hook versions are still pinned by `.pre-commit-config.yaml` (#36)"
    - "gate-check pre-commit: on failure, the captured stdout/stderr tail is surfaced as `details` instead of running a fragile parse-for-lines-containing-'Failed' filter. Previously, when something *impersonated* pre-commit (e.g. `uv run pre-commit` printing a `uv` build error before pre-commit ran), the parser silently discarded the actual failure and the user saw only 'Some hooks failed'. Now the raw output is visible (last 15 non-empty lines) when running `gate-check -v`"
    - "Container-runtime test guard now verifies the daemon is actually reachable (via `docker info` / `podman info`), not just that the binary exists, so `test_lmer_features.py` and `test_lmer_integration.py` skip cleanly when there is no docker socket (e.g. self-dev runs) instead of failing the gate check (#26)"
    - Expanded permissions allow list to reduce unnecessary permission prompts for common shell utilities, git subcommands, and gate command path variants
    - Fixed typo in permissions (Bask -> Bash for awk)
    - Credential stripping in URL parsing (netloc -> hostname) to prevent token leakage
    - Podman --cache-from compatibility (flag only passed for Docker)
    - Tag extraction no longer confuses registry port numbers with image tags
    - "Agent instructions now use bare `gate-check`/`gate-commit`/`gate-push` instead of `bin/gate-*`, which only works in self-development mode and caused confusion in normal task runs (#19)"
    - "Agent instructions now require a minimum 5-minute (300000 ms) Bash timeout for gate commands to prevent premature termination of tests and pre-commit hooks (#19)"
    - "gitlab-review: follow pagination on list endpoints (`--comments`, `--all-comments`, `--issue-comments`, `--all-issue-comments`, `--list`, `--list-templates`, `--info` participants) instead of silently returning only the first page; adds `--page-size` and `--max-pages` flags and a stderr warning when the page cap is reached (#29)"
    - "lmer-pipe `follow` no longer retries forever on HTTP errors. The retry catch is now narrowed to `ConnectionError`/`Timeout`; HTTPError (401/403/404/5xx) propagates so the user sees a real exit code instead of a silent loop"
    - "lmer-pipe `read --wait` now auto-extends the client HTTP timeout to outlast the server-side long-poll budget, so `--wait > --timeout` returns data instead of raising `ReadTimeout`"
    - "gate-check `check_tests` now prepends the project's `src/` tree to the pytest subprocess `PYTHONPATH` so the test run imports the working copy. Previously, in self-dev mode an inherited `PYTHONPATH` from the operational install shadowed the project source and caused new tests to fail with `ImportError`/`AttributeError` (#33)"
    - "Work-repo Claude assets: the `Linked N global commands/skills` count printed by `claude-runner.sh` now reflects the effective layout — entries shadowed by a work-repo override of the same name are no longer double-counted. Work-repo entries are linked first; global entries are skipped when a work-repo entry of the same name already exists (#48)"
    - "Work-repo Claude assets: `claude_merge_work_settings` now warns when a work-repo `settings.json` is present but the global `settings.json` is missing, instead of silently dropping the work-repo `permissions.allow`. Previously, a project maintainer adding an allow entry to the work repo and seeing no effect had no signal as to why (#48)"
    - "CI: install `jq` in the `pytest` job's `before_script`. The `python:3.12` base image does not ship jq, and `libexec/claude-agent-files.sh` requires it to merge work-repo `permissions.allow` into `~/.claude/settings.json`; the merge tests therefore failed in CI even though they passed locally inside the runtime container which already has jq (#48)"
    - "Auto `/start` no longer occasionally fails to submit. Three layers cover the failure modes: (1) the supervisor pre-clears `ICRNL`/`ECHO`/`ICANON` on the PTY before fork when auto-start is enabled, so the injected `/start\\r` is delivered to Claude as raw CR (not CR→LF mangled to a literal newline by the default cooked-mode line discipline) and is not echoed back to the host TTY as visible blank lines pushing the banner upward; (2) injection is deferred until Claude's input-prompt glyph (`❯`) appears in the output stream, so any startup modal/dialog (theme picker, IDE detect, permission prompt, etc.) has finished consuming Enter keystrokes — Claude Code v2.1.119 changed Enter routing so an open dialog consumes the submit CR instead of also submitting input-box text, which made the previous time-based injection race against the dialog; (3) the initial `/start\\r` is followed by a few bare carriage-return nudges that re-trigger submission if the initial Enter is swallowed during a startup re-render (each nudge is a no-op once `/start` has gone through). Tune the nudge gap with `--auto-start-nudge-delay` / `LMER_AUTO_START_NUDGE_DELAY` (default 0.5s), the prompt-ready wait with `--auto-start-ready-timeout` / `LMER_AUTO_START_READY_TIMEOUT` (default 15s; 0 disables marker gating), and override the prompt-ready marker bytes with `LMER_AUTO_START_READY_MARKER` (UTF-8; default `❯`; empty string disables marker gating) so a future Claude UI change can be patched without a release (#37)"
