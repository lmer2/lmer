# lmer change log
#
# Entries under `unreleased` accumulate between releases. Issue numbers
# referenced in older entries (e.g. `#19`–`#36`) are from the project's
# pre-open-source GitLab tracker and are kept here for historical context;
# new entries should reference GitHub issues at
# https://github.com/lmer2/lmer/issues.

