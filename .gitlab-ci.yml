stages:
  - lint
  - test
  - build
  - publish

default:
  image: python:3.12-slim

variables:
  UV_SYSTEM_PYTHON: "1"

#──────────────────────────────────────────────────────────────────────────────
# LINT STAGE
#──────────────────────────────────────────────────────────────────────────────

pre-commit:
  stage: lint
  image: python:3.12  # Full image includes git
  before_script:
    - pip install uv && uv sync --frozen
  script:
    - uv run pre-commit run --all-files
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

#──────────────────────────────────────────────────────────────────────────────
# TEST STAGE
#──────────────────────────────────────────────────────────────────────────────

pytest:
  stage: test
  image: python:3.12  # Full image includes git
  before_script:
    - pip install uv && uv sync --frozen
  script:
    - uv run pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml:coverage.xml
  coverage: '/TOTAL.*\s(\d+%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

#──────────────────────────────────────────────────────────────────────────────
# BUILD STAGE
#──────────────────────────────────────────────────────────────────────────────

build-package:
  stage: build
  image: python:3.12  # Full image includes git for building
  before_script:
    - pip install uv
  script:
    - uv build
    - ls -la dist/
  artifacts:
    paths:
      - dist/*.whl
      - dist/*.tar.gz
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build-container:
  stage: build
  image: docker:24.0
  services:
    - docker:24.0-dind
  variables:
    # TLS disabled: the GitLab Kubernetes executor does not share the
    # /certs/client volume between the dind service and the build container,
    # so the build container cannot find ca.pem at docker login. Traffic
    # stays on localhost inside a single pod, so plaintext is acceptable.
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://localhost:2375"
  before_script:
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker build -t ${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG} -t ${CI_REGISTRY_IMAGE}:latest -f Containerfile .
      else
        docker build -t ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA} -f Containerfile .
        docker push ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}
      fi
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

#──────────────────────────────────────────────────────────────────────────────
# PUBLISH STAGE
#──────────────────────────────────────────────────────────────────────────────

publish-pypi:
  stage: publish
  before_script:
    - pip install twine
  script:
    - |
      TWINE_PASSWORD=${CI_JOB_TOKEN} \
      TWINE_USERNAME=gitlab-ci-token \
      python -m twine upload \
        --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi \
        dist/*
  dependencies:
    - build-package
  rules:
    - if: $CI_COMMIT_TAG
  environment:
    name: pypi

publish-container:
  stage: publish
  image: docker:24.0
  services:
    - docker:24.0-dind
  variables:
    # See build-container for the rationale on disabling dind TLS.
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://localhost:2375"
  before_script:
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
  script:
    - docker build -t ${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG} -t ${CI_REGISTRY_IMAGE}:latest -f Containerfile .
    - docker push ${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}
    - docker push ${CI_REGISTRY_IMAGE}:latest
  rules:
    - if: $CI_COMMIT_TAG
  environment:
    name: container-registry
