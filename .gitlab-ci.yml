stages:
  - lint
  - test
  - build
  - publish

default:
  image: python:3.12-slim

variables:
  UV_SYSTEM_PYTHON: "1"
  # The platform image (Dockerfile.platform, issue #150) is a second artifact of
  # this project, not a variant of the session image ${CI_REGISTRY_IMAGE} holds,
  # so it gets its own repository under the project's registry path. Named once
  # here because both the build and the publish job tag from it.
  PLATFORM_IMAGE: "${CI_REGISTRY_IMAGE}/lmer-platform"

#──────────────────────────────────────────────────────────────────────────────
# LINT STAGE
#──────────────────────────────────────────────────────────────────────────────

pre-commit:
  stage: lint
  image: python:3.12  # Full image includes git
  before_script:
    - pip install uv && uv sync --frozen
  script:
    - uv run pre-commit run --all-files
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

#──────────────────────────────────────────────────────────────────────────────
# TEST STAGE
#──────────────────────────────────────────────────────────────────────────────

pytest:
  stage: test
  image: python:3.12  # Full image includes git
  variables:
    # Arm the strict mode of tests/conftest.py's require_node_toolchain: with
    # this set, a missing Node toolchain fails the web guards that *execute*
    # their sources instead of skipping them. Those are the only tests that run
    # hostile input through Markdown.vue's real render path and the only one that
    # builds the bundle to check its chunk split — and on this image they all
    # skipped, silently, because a skip is an `s` in a run that still exits 0.
    # The toolchain they need is installed in before_script; if that install ever
    # breaks, this variable is what turns the resulting silence into a red job.
    LMER_TESTS_REQUIRE_NODE: "1"
  before_script:
    # jq is required at runtime by libexec/claude-agent-files.sh to merge
    # the work-repo permissions.allow into ~/.claude/settings.json. The
    # python:3.12 image does not ship it, so the merge tests fail without
    # this install. The runtime container (Containerfile) installs jq too.
    - apt-get update && apt-get install -y --no-install-recommends jq
    # `--extra matrix` deliberately: the Matrix bridge's dependencies live in an
    # optional extra (issue #327), and a plain `uv sync` leaves them out — which
    # turned the bridge's own guards into silent skips and made a green pipeline
    # mean less than it looked like it meant (!242/!243 review). Every extra this
    # project defines belongs in this line for the same reason: a dependency CI
    # never installs is a dependency CI never tests.
    - pip install uv && uv sync --frozen --extra matrix
    # The Node the guards above run under, fetched with the same command an
    # operator runs on a host: `setup-ui` downloads the pinned Node
    # (lmer_platform.ui_build.NODE_VERSION, SHA-256 verified) into
    # ~/.lmer/platform/node/, runs `npm ci` in web/ and builds the bundle —
    # which is exactly what those tests look for: the pinned node binary (the
    # second root tests._node_binary tries), web/node_modules to resolve
    # markdown-it, dompurify and vite out of, and a dist newer than its sources
    # so the bundle test reuses this build instead of repeating it.
    #
    # Reusing the command rather than installing Node here keeps the version pin
    # in one place: apt's nodejs would be a second, older toolchain that builds a
    # different artifact than the pin describes, and a literal version in this
    # file would rot the first time that pin moves.
    #
    # Nothing is cached deliberately. The two paths worth caching are the Node
    # tree and npm's cache, and both live under ~/.lmer/platform, outside
    # $CI_PROJECT_DIR — which is the only place GitLab's cache can take paths
    # from. What is inside it, web/node_modules (123 MB) and web/dist, is
    # replaced wholesale by `npm ci` and by the mtime comparison that decides a
    # rebuild, so caching either would upload a cache to save nothing.
    - uv run lmer platform setup-ui
  script:
    - uv run pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml:coverage.xml
  coverage: '/TOTAL.*\s(\d+%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

#──────────────────────────────────────────────────────────────────────────────
# BUILD STAGE
#──────────────────────────────────────────────────────────────────────────────

build-package:
  stage: build
  image: python:3.12  # Full image includes git for building
  before_script:
    - pip install uv
  script:
    - uv build
    - ls -la dist/
  artifacts:
    paths:
      - dist/*.whl
      - dist/*.tar.gz
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build-container:
  stage: build
  image: docker:24.0
  services:
    - docker:24.0-dind
  variables:
    # TLS disabled: the /certs/client volume is not shared between the dind
    # service and the build container, so the build container cannot find
    # ca.pem at docker login. Traffic never leaves the runner host, so
    # plaintext is acceptable.
    DOCKER_TLS_CERTDIR: ""
    # Reach dind by its service alias. Under the docker executor the service
    # is a separate container, so localhost is not it -- localhost only works
    # on the Kubernetes executor, where the service shares the build pod's
    # network namespace. If this project ever builds on a k8s runner, this
    # value has to follow the executor.
    DOCKER_HOST: "tcp://docker:2375"
  before_script:
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
  script:
    # One build, whatever the pipeline is for. A tag pipeline used to build the
    # image here, throw it away, and build a second, independently resolved copy
    # in publish-container to push (#189) — so the released image was not the one
    # anything had exercised. The commit-tagged image this job pushes is now the
    # artifact publish-container promotes to :${CI_COMMIT_TAG} and :latest.
    - docker build -t ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA} -f Containerfile .
    - docker push ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}
    - scripts/ci-image.sh digest "${CI_REGISTRY_IMAGE}" "${CI_COMMIT_SHORT_SHA}" SESSION_IMAGE_DIGEST > build.env
    - cat build.env
  artifacts:
    # How the digest reaches publish-container. A dotenv report is the narrowest
    # carrier for it: it is a variable in the later job rather than a file it has
    # to find and parse.
    reports:
      dotenv: build.env
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build-platform-container:
  stage: build
  image: docker:24.0
  services:
    - docker:24.0-dind
  variables:
    # See build-container for the rationale on disabling dind TLS and on
    # addressing the service as `docker` rather than localhost.
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://docker:2375"
  before_script:
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
  script:
    # LMER_BUILD_COMMIT is baked into the image (Dockerfile.platform writes it to
    # /opt/lmer/BUILD_INFO) because the installed tree has no .git to answer
    # "what commit is this?" with. The full SHA, not the short one: the tag says
    # which build this is, the provenance says which commit exactly. BUILD_UID and
    # BUILD_GID are left at their 1000 defaults, as the session image's build does.
    # One build, whatever the pipeline is for — see build-container for why the
    # tag pipeline no longer builds a second copy in the publish stage (#189).
    - docker build --build-arg LMER_BUILD_COMMIT=${CI_COMMIT_SHA}
        -t ${PLATFORM_IMAGE}:${CI_COMMIT_SHORT_SHA} -f Dockerfile.platform .
    - |
      # A merge-request run builds only: it is a check on the Dockerfile, and
      # nothing consumes a per-branch platform image. Every other run pushes the
      # commit-tagged image and records the digest the registry stored it as,
      # which is what publish-platform-container promotes to the release tags.
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        echo "PLATFORM_IMAGE_PUSHED=no" > build.env
      else
        docker push ${PLATFORM_IMAGE}:${CI_COMMIT_SHORT_SHA}
        echo "PLATFORM_IMAGE_PUSHED=yes" > build.env
        scripts/ci-image.sh digest "${PLATFORM_IMAGE}" "${CI_COMMIT_SHORT_SHA}" PLATFORM_IMAGE_DIGEST >> build.env
      fi
      cat build.env
  artifacts:
    # See build-container: this is how the digest reaches the publish stage. The
    # file is written on every path, including the merge-request one that has no
    # digest to report, because the report is declared unconditionally.
    reports:
      dotenv: build.env
    expire_in: 1 week
  rules:
    # Unlike build-container this also runs on merge requests, because the build
    # *is* the check on Dockerfile.platform — no test can tell whether `npm ci`,
    # the UI build or `pip install .` still succeed inside it — and a check that
    # first runs after the merge cannot fail the merge request that broke it.
    # Scoped with changes: so it costs nothing on the merge requests that touch
    # neither the recipe nor what it builds.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - Dockerfile.platform
        - .dockerignore
        - pyproject.toml
        # COPY targets the install needs (pyproject names them for `readme` and
        # `license-files`): renaming or removing one breaks the build, so the
        # build has to run on the merge request that does it.
        - README.md
        - LICENSE
        - web/**/*
        # How the job invokes the recipe, not just the recipe: the build args it
        # passes, what it pushes and the digest it records. By the same argument
        # as above — a change here that breaks this job would otherwise first run
        # after the merge — and it is the argument #189 turned on, so a fix for
        # "an artifact nobody checked" that itself ships unchecked would be an
        # odd way to close it.
        - .gitlab-ci.yml
        - scripts/ci-image.sh
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

#──────────────────────────────────────────────────────────────────────────────
# PUBLISH STAGE
#──────────────────────────────────────────────────────────────────────────────

publish-pypi:
  stage: publish
  before_script:
    - pip install twine
  script:
    - |
      TWINE_PASSWORD=${CI_JOB_TOKEN} \
      TWINE_USERNAME=gitlab-ci-token \
      python -m twine upload \
        --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi \
        dist/*
  dependencies:
    - build-package
  rules:
    - if: $CI_COMMIT_TAG
  environment:
    name: pypi

publish-container:
  stage: publish
  image: docker:24.0
  services:
    - docker:24.0-dind
  variables:
    # See build-container for the rationale on disabling dind TLS and on
    # addressing the service as `docker` rather than localhost.
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://docker:2375"
  # Takes the build stage's dotenv (SESSION_IMAGE_DIGEST) and not build-package's
  # wheel. `dependencies:` rather than `needs:`, deliberately: `needs:` would also
  # release this job from waiting on the rest of the pipeline, and a release must
  # not push a container image while pytest is still running.
  dependencies:
    - build-container
  before_script:
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
  script:
    # Promotes the image build-container built and pushed, by digest — it does
    # not build one. See scripts/ci-image.sh for why re-building here published
    # an artifact nothing had checked (#189), and for the digest comparison that
    # demonstrates the released tags carry the built bytes.
    - scripts/ci-image.sh promote "${CI_REGISTRY_IMAGE}" "${SESSION_IMAGE_DIGEST}" "${CI_COMMIT_TAG}" latest
  rules:
    - if: $CI_COMMIT_TAG
  environment:
    name: container-registry

publish-platform-container:
  stage: publish
  image: docker:24.0
  services:
    - docker:24.0-dind
  variables:
    # See build-container for the rationale on disabling dind TLS and on
    # addressing the service as `docker` rather than localhost.
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://docker:2375"
  # See publish-container for why this is `dependencies:` and not `needs:`.
  dependencies:
    - build-platform-container
  before_script:
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
  script:
    # Promotes build-platform-container's image by digest rather than building a
    # second one. The rebuild this replaces was the sharpest case of #189: the
    # image was the only check on Dockerfile.platform, and `docker-ce-cli` is
    # deliberately unpinned while npm optional dependencies resolve per build, so
    # the copy that shipped could differ from the copy that was exercised.
    - scripts/ci-image.sh promote "${PLATFORM_IMAGE}" "${PLATFORM_IMAGE_DIGEST}" "${CI_COMMIT_TAG}" latest
  rules:
    - if: $CI_COMMIT_TAG
  environment:
    name: container-registry
